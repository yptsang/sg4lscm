            <p class="section-copy">
              Each bright can represents one unit on hand.
            </p>

            <div
              class="vending-scene"
              role="img"
              aria-label="Vending machine containing ${state.onHand} of ${CONFIG.MAX_CAPACITY} cans"
            >
              <div class="machine-top">
                <span>FIZZFLOW COLA</span>
                <span
                  class="machine-light"
                  title="Machine online"
                ></span>
              </div>

              <div class="machine-window">
                <div class="can-grid">${cans}</div>
              </div>

              <div class="machine-bottom">
                <div class="dispenser" aria-hidden="true"></div>
                <div class="machine-buttons" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </div>
            </div>

            <div class="machine-legs" aria-hidden="true">
              <span></span>
              <span></span>
            </div>

            <div class="stock-caption">
              ${state.onHand} cans available
              <br>
              <span>Capacity: ${CONFIG.MAX_CAPACITY} cans</span>
            </div>
          </div>

          ${pipelineMarkup()}
        </section>
      `;
    }

    function pipelineMarkup() {
      const sortedPipeline = [...state.pipeline].sort(
        (a, b) => a.arrivalDay - b.arrivalDay
      );

      const items = sortedPipeline.length
        ? sortedPipeline.map(order => {
            const difference =
              order.arrivalDay - state.day;

            const timing =
              difference === 1
                ? "arriving tomorrow"
                : `arriving in ${difference} days`;

            return `
              <li class="pipeline-item">
                <strong>${order.qty} cans</strong>
                <span>${timing} · Day ${order.arrivalDay}</span>
              </li>
            `;
          }).join("")
        : `
          <li class="pipeline-empty">
            No deliveries are currently on the way.
          </li>
        `;

      return `
        <aside class="pipeline" aria-labelledby="pipelineHeading">
          <h3 id="pipelineHeading">
            <span aria-hidden="true">🚚</span>
            Delivery pipeline
          </h3>
          <ul class="pipeline-list">${items}</ul>
        </aside>
      `;
    }

    function overflowWarningMarkup(quantity) {
      const risk = overflowRiskForOrder(quantity);

      if (quantity <= 0 || risk <= 0) {
        return "";
      }

      return `
        <div class="warning-banner">
          <span class="banner-icon" aria-hidden="true">⚠️</span>
          <div>
            <strong>Possible overflow:</strong>
            if little stock sells before delivery, up to ${risk}
            can${risk === 1 ? "" : "s"} may not fit.
            Rejected cans still cost money.
          </div>
        </div>
      `;
    }

    function decisionMarkup() {
      const orderingAllowed = canOrderToday();
      const maximum = orderingAllowed
        ? CONFIG.MAX_ORDER_QUANTITY
        : 0;

      const quantity = orderingAllowed
        ? clamp(state.orderQty, 0, maximum)
        : 0;

      return `
        <section class="card decision-card" aria-labelledby="orderHeading">
          <div class="decision-heading">
            <div>
              <span class="eyebrow">Your decision</span>
              <h2 id="orderHeading" class="section-heading">
                How many cans will you order?
              </h2>
              <p class="section-copy">
                ${
                  orderingAllowed
                    ? `Today's order arrives at the start of Day ${
                        state.day + CONFIG.DELIVERY_LEAD_TIME
                      }.`
                    : `A new order would arrive after Day ${CONFIG.SIMULATION_DAYS}, so ordering is closed.`
                }
              </p>
            </div>

            <span class="cost-chip">
              $${CONFIG.PURCHASE_COST.toFixed(2)} per can
            </span>
          </div>

          ${
            orderingAllowed
              ? ""
              : `
                <div class="warning-banner" role="status">
                  <span class="banner-icon" aria-hidden="true">⏳</span>
                  <div>
                    Run today with no order. Existing deliveries will
                    still arrive on schedule.
                  </div>
                </div>
              `
          }

          <div class="order-stepper">
            <button
              id="minusButton"
              class="step-button"
              type="button"
              aria-label="Decrease order quantity"
              ${orderingAllowed ? "" : "disabled"}
            >−</button>

            <label class="sr-only" for="quantityInput">
              Order quantity in cans
            </label>

            <input
              id="quantityInput"
              class="quantity-input"
              type="number"
              inputmode="numeric"
              min="0"
              max="${maximum}"
              step="1"
              value="${quantity}"
              ${orderingAllowed ? "" : "disabled"}
            >

            <button
              id="plusButton"
              class="step-button"
              type="button"
              aria-label="Increase order quantity"
              ${orderingAllowed ? "" : "disabled"}
            >+</button>
          </div>

          <div class="slider-wrap">
            <label class="slider-label" for="orderSlider">
              <span>0 cans</span>
              <span>Maximum ${maximum}</span>
            </label>

            <input
              id="orderSlider"
              type="range"
              min="0"
              max="${maximum}"
              step="1"
              value="${quantity}"
              aria-label="Order quantity slider"
              ${orderingAllowed ? "" : "disabled"}
            >
          </div>

          <div class="order-preview" aria-live="polite">
            <div class="mini-metric">
              <span>Order quantity</span>
              <strong id="previewQuantity">${quantity}</strong>
            </div>

            <div class="mini-metric">
              <span>Purchase + delivery</span>
              <strong id="previewCost">
                ${formatCurrency(
                  quantity * CONFIG.PURCHASE_COST +
                  (
                    quantity > 0
                      ? CONFIG.FIXED_DELIVERY_COST
                      : 0
                  )
                )}
              </strong>
            </div>

            <div class="mini-metric">
              <span>Position after order</span>
              <strong id="previewPosition">
                ${inventoryPosition() + quantity}
              </strong>
            </div>
          </div>

          <div id="overflowWarning" aria-live="polite">
            ${overflowWarningMarkup(quantity)}
          </div>

          <p class="menu-instruction">
            Use the yellow button in the top menu to reveal demand.
            Purchase and delivery costs are charged when the order is placed.
          </p>
        </section>
      `;
    }

    function resultMarkup() {
      const item =
        state.history[state.history.length - 1];

      const totalDailyCosts = roundMoney(
        item.purchaseCost +
        item.fixedCost +
        item.holdingCost +
        item.stockoutPenalty
      );

      return `
        <section
          id="resultCard"
          class="card result-card"
          aria-labelledby="resultHeading"
        >
          <div class="result-hero ${
            item.lostSales > 0 ? "stockout" : ""
          }">
            <span class="eyebrow">Day ${item.day} result</span>

            <div class="result-demand">
              <h2 id="resultHeading" class="section-heading">
                Actual customer demand
              </h2>
              <strong>${item.demand} cans</strong>
            </div>

            <p class="result-message">
              ${dailyEncouragement(item)}
            </p>
          </div>

          <div class="result-grid">
            <div class="result-metric">
              <span>Units sold</span>
              <strong>${item.sales}</strong>
            </div>

            <div class="result-metric">
              <span>Lost sales</span>
              <strong class="${
                item.lostSales > 0
                  ? "negative"
                  : "positive"
              }">
                ${item.lostSales}
              </strong>
            </div>

            <div class="result-metric">
              <span>Ending inventory</span>
              <strong>${item.endingInventory}</strong>
            </div>

            <div class="result-metric">
              <span>Daily profit</span>
              <strong class="${
                item.dailyProfit < 0
                  ? "negative"
                  : "positive"
              }">
                ${formatCurrency(item.dailyProfit)}
              </strong>
            </div>
          </div>

          <div class="cost-breakdown" aria-label="Daily financial breakdown">
            <div class="cost-item">
              Revenue
              <strong class="positive">
                ${formatCurrency(item.revenue)}
              </strong>
            </div>

            <div class="cost-item">
              Purchase
              <strong>${formatCurrency(item.purchaseCost)}</strong>
            </div>

            <div class="cost-item">
              Delivery
              <strong>${formatCurrency(item.fixedCost)}</strong>
            </div>

            <div class="cost-item">
              Holding
              <strong>${formatCurrency(item.holdingCost)}</strong>
            </div>

            <div class="cost-item">
              Stockout penalty
              <strong>${formatCurrency(item.stockoutPenalty)}</strong>

          <div class="info-banner">
            <span class="banner-icon" aria-hidden="true">🧾</span>

          <p class="menu-instruction">

    function chartAndHistoryMarkup() {
      const rows = state.history.length
        ? state.history.map(item => `
            <div
              class="log-row ${
                item.lostSales > 0
                  ? "stockout-row"
                  : ""
              }"
              role="row"
            >
              <span data-label="Day" role="cell">${item.day}</span>
              <span data-label="Forecast" role="cell">
                ${item.forecastLow}–${item.forecastHigh}
              </span>
              <span data-label="Order" role="cell">${item.order}</span>
              <span data-label="Demand" role="cell">${item.demand}</span>
              <span data-label="Sales" role="cell">${item.sales}</span>
              <span data-label="End stock" role="cell">
                ${item.endingInventory}
              </span>
              <span
                data-label="Profit"
                role="cell"
                class="${
                  item.dailyProfit < 0
                    ? "negative"
                    : "positive"
                }"
              >
                ${formatCurrency(item.dailyProfit)}
              </span>
            </div>
          `).join("")
        : `
          <p class="section-copy">
            Run Day 1 to begin your daily log.
          </p>
        `;

      return `
        <section class="card chart-card" aria-labelledby="chartHeading">
          <div class="chart-header">
            <div>
              <h2 id="chartHeading" class="section-heading">
                Inventory flow chart
              </h2>
              <p class="section-copy">
                Demand, ending inventory, and orders over time.
              </p>
            </div>

            <div class="chart-legend" aria-label="Chart legend">
              <span class="legend-item">
                <span class="legend-dot legend-demand"></span>
                Demand
              </span>
              <span class="legend-item">
                <span class="legend-dot legend-stock"></span>
                Ending inventory
              </span>
              <span class="legend-item">
                <span class="legend-dot legend-order"></span>
                Order
              </span>
              <span class="legend-item">
                <span class="legend-dot legend-stockout">×</span>
                Stockout
              </span>
            </div>
          </div>

          <div class="chart-wrap">
            <canvas
              id="historyChart"
              role="img"
              aria-label="Chart of daily demand, ending inventory, orders, and stockout days"
            ></canvas>

            ${
              state.history.length
                ? ""
                : `
                  <div class="chart-empty">
                    Your chart will appear after the first day.
                  </div>
                `
            }
          </div>
        </section>

        <section class="card history-card" aria-labelledby="historyHeading">
          <h2 id="historyHeading" class="section-heading">
            Daily log
          </h2>

          <details>
            <summary>
              Expand completed days (${state.history.length})
            </summary>

            <div role="table" aria-label="Daily inventory history">
              <div class="log-head" role="row">
                <span role="columnheader">Day</span>
                <span role="columnheader">Forecast</span>
                <span role="columnheader">Order</span>
                <span role="columnheader">Demand</span>
                <span role="columnheader">Sales</span>
                <span role="columnheader">End stock</span>
                <span role="columnheader">Profit</span>
              </div>

              ${rows}
            </div>
          </details>
        </section>
      `;
    }

    function gameMarkup() {
      const dayData =
        state.scenario[state.day - 1];

      return `
        <section class="card top-panel">
          <div class="day-heading-row">
            <div>
              <span class="eyebrow">${dayData.weekday}</span>
              <h1>Day ${state.day} of ${CONFIG.SIMULATION_DAYS}</h1>
            </div>

            <span class="seed-label" title="Scenario seed">
              Scenario ${state.seed}
            </span>
          </div>

          <div class="progress-label">
            <span>30-day challenge</span>
            <span>${state.history.length} completed</span>
          </div>

          <div
            class="day-progress"
            role="img"
            aria-label="${state.history.length} of ${CONFIG.SIMULATION_DAYS} days completed"
          >
            ${progressMarkup()}
          </div>

          ${statsMarkup()}
          ${arrivalBannerMarkup()}
        </section>

        <div class="game-layout">
          ${vendingMachineMarkup()}

          <div class="right-column">
            ${forecastMarkup(dayData)}

    /* =========================================================
       FINAL REPORT MARKUP
       ========================================================= */
    function benchmarkRow(label, player, benchmark) {
      return `
        <div
          class="benchmark-cell benchmark-label"
          role="rowheader"
        >
          ${label}
        </div>

        <div
          class="benchmark-cell benchmark-value"
          role="cell"
        >
          ${player}
        </div>

        <div
          class="benchmark-cell benchmark-value"
          role="cell"
        >
          ${benchmark}
        </div>
      `;
    }

    function resultsMarkup() {
      const benchmark = simulateBenchmark();
      const score = calculateScore(benchmark);
      const rating = ratingForScore(score);

      const averageInventory =
        state.metrics.endingInventorySum /
        CONFIG.SIMULATION_DAYS;

      const service = serviceLevel(state.metrics);

      const bestDay = [...state.history].sort(
        (a, b) => b.dailyProfit - a.dailyProfit
      )[0];

      const difficultDay = [...state.history].sort(
        (a, b) => {
          if (b.lostSales !== a.lostSales) {
            return b.lostSales - a.lostSales;
          }

          return a.dailyProfit - b.dailyProfit;
        }
      )[0];

      return `
        <div class="results-page">
          <section class="card score-hero">
            <div
              class="score-ring"
              aria-label="Overall score ${score} out of 100"
            >
              <div>
                <strong>${score}</strong>
                <span>OUT OF 100</span>
              </div>
            </div>

            <div class="score-copy">
              <span
                class="eyebrow"
                style="color:#ffd45a"
              >
                30-day challenge complete
              </span>
              <h1>${rating}</h1>
              <p>${personalizedResult(averageInventory)}</p>
            </div>
          </section>

          <section
            class="report-grid"
            aria-label="Final performance metrics"
          >
            <article class="report-stat">
              <span>Total profit</span>
              <strong class="${
                state.metrics.profit < 0
                  ? "negative"
                  : "positive"
              }">
                ${formatCurrency(state.metrics.profit)}
              </strong>
              <small>Revenue minus all costs</small>
            </article>

            <article class="report-stat">
              <span>Total revenue</span>
              <strong>
                ${formatCurrency(state.metrics.revenue)}
              </strong>
              <small>${state.metrics.sold} cans sold</small>
            </article>

            <article class="report-stat">
              <span>Inventory-related costs</span>
              <strong>
                ${formatCurrency(totalCosts(state.metrics))}
              </strong>
              <small>
                Purchase, delivery, holding and penalties
              </small>
            </article>

            <article class="report-stat">
              <span>Service level</span>
              <strong>${formatPercent(service)}</strong>
              <small>Units sold ÷ total demand</small>
            </article>

            <article class="report-stat">
              <span>Total units sold</span>
              <strong>${state.metrics.sold}</strong>
              <small>Demand was ${state.metrics.demand}</small>
            </article>

            <article class="report-stat">
              <span>Total lost sales</span>
              <strong>${state.metrics.lost}</strong>
              <small>
                ${state.metrics.stockoutDays} stockout days
              </small>
            </article>

            <article class="report-stat">
              <span>Average ending inventory</span>
              <strong>${averageInventory.toFixed(1)}</strong>
              <small>Average cans left each day</small>
            </article>

            <article class="report-stat">
              <span>Rejected overflow units</span>
              <strong>${state.metrics.rejected}</strong>
              <small>Purchased cans that did not fit</small>
            </article>
          </section>

          <section class="card report-section">
            <h2 class="section-heading">
              Best and most difficult days
            </h2>

            <div class="day-highlights">
              <article class="highlight-card">
                <strong>🌟 Best day: Day ${bestDay.day}</strong>
                <p>
                  Demand ${bestDay.demand}, sales ${bestDay.sales},
                  ending stock ${bestDay.endingInventory}, and profit
                  ${formatCurrency(bestDay.dailyProfit)}.
                </p>
              </article>

              <article class="highlight-card">
                <strong>
                  🧩 Most difficult: Day ${difficultDay.day}
                </strong>
                <p>
                  Demand ${difficultDay.demand}, lost sales
                  ${difficultDay.lostSales}, ending stock
                  ${difficultDay.endingInventory}, and profit
                  ${formatCurrency(difficultDay.dailyProfit)}.
                </p>
              </article>
            </div>
          </section>

          <section
            class="card report-section"
            aria-labelledby="benchmarkHeading"
          >
            <span class="eyebrow">Same demand scenario</span>
            <h2 id="benchmarkHeading" class="section-heading">
              Reorder-point benchmark
            </h2>

            <p class="section-copy">
              The benchmark orders up to
              ${CONFIG.BENCHMARK_ORDER_UP_TO} cans whenever its
              inventory position is
              ${CONFIG.BENCHMARK_REORDER_POINT} or lower.
              It is not always perfect, but it demonstrates how a
              consistent policy can support inventory decisions.
            </p>

            <div
              class="benchmark-grid"
              role="table"
              aria-label="Player and benchmark comparison"
            >
              <div
                class="benchmark-cell benchmark-head"
                role="columnheader"
              >
                Measure
              </div>

              <div
                class="benchmark-cell benchmark-head benchmark-value"
                role="columnheader"
              >
                You
              </div>

              <div
                class="benchmark-cell benchmark-head benchmark-value"
                role="columnheader"
              >
                Benchmark
              </div>

              ${benchmarkRow(
                "Profit",
                formatCurrency(state.metrics.profit),
                formatCurrency(benchmark.metrics.profit)
              )}

              ${benchmarkRow(
                "Service level",
                formatPercent(service),
                formatPercent(benchmark.serviceLevel)
              )}

              ${benchmarkRow(
                "Average inventory",
                averageInventory.toFixed(1),
                benchmark.averageInventory.toFixed(1)
              )}

                "Stockout days",
                String(state.metrics.stockoutDays),
                String(benchmark.metrics.stockoutDays)

          ${chartAndHistoryMarkup()}

              id="resultsRestartButton"
              class="secondary-button"
              type="button"

              Replay same scenario

              class="primary-button"

              Play a new scenario

    /* =========================================================
       MAIN RENDERING
       ========================================================= */
    function render() {
      app.innerHTML =
        state.phase === "ended"
          ? resultsMarkup()
          : gameMarkup();

      renderCommandBar();
      updateHeaderIcons();
      bindRenderedEvents();

      requestAnimationFrame(drawHistoryChart);
    }

    function bindRenderedEvents() {
      const minusButton =
        document.getElementById("minusButton");

      const plusButton =
        document.getElementById("plusButton");

      const quantityInput =
        document.getElementById("quantityInput");

      const slider =
        document.getElementById("orderSlider");

      const resultsRestartButton =
        document.getElementById("resultsRestartButton");

      const resultsNewButton =
        document.getElementById("resultsNewButton");

      if (minusButton) {
        minusButton.addEventListener("click", () => {
          updateOrderQuantity(state.orderQty - 1);
          playSound("tap");
        });
      }

      if (plusButton) {
        plusButton.addEventListener("click", () => {
          updateOrderQuantity(state.orderQty + 1);
          playSound("tap");
        });
      }

      if (quantityInput) {
        quantityInput.addEventListener("input", event => {
          updateOrderQuantity(event.target.value);
        });

        quantityInput.addEventListener("blur", () => {
          updateOrderQuantity(quantityInput.value);
        });
      }

      if (slider) {
        slider.addEventListener("input", event => {
          updateOrderQuantity(event.target.value);
        });
      }

      if (resultsRestartButton) {
        resultsRestartButton.addEventListener(
          "click",
          showRestartConfirmation
        );
      }

      if (resultsNewButton) {
        resultsNewButton.addEventListener(
          "click",
          showNewScenarioConfirmation
        );
      }
    }

    function updateOrderQuantity(value) {
      const orderingAllowed = canOrderToday();

      const quantity = orderingAllowed
        ? clamp(
            Math.round(Number(value) || 0),
            0,
            CONFIG.MAX_ORDER_QUANTITY
          )
        : 0;

      state.orderQty = quantity;

      const quantityInput =
        document.getElementById("quantityInput");

      const slider =
        document.getElementById("orderSlider");

      const previewQuantity =
        document.getElementById("previewQuantity");

      const previewCost =
        document.getElementById("previewCost");

      const previewPosition =
        document.getElementById("previewPosition");

      const warning =
        document.getElementById("overflowWarning");

      const headerOrderValue =
        document.getElementById("headerOrderValue");

      const menuActionButton =
        document.getElementById("menuActionButton");

      if (quantityInput) {
        quantityInput.value = quantity;
      }

      if (slider) {
        slider.value = quantity;
      }

      if (previewQuantity) {
        previewQuantity.textContent = quantity;
      }

      if (previewCost) {
        previewCost.textContent = formatCurrency(
          quantity * CONFIG.PURCHASE_COST +
          (
            quantity > 0
              ? CONFIG.FIXED_DELIVERY_COST
              : 0
          )
        );
      }

      if (previewPosition) {
        previewPosition.textContent =
          inventoryPosition() + quantity;
      }

      if (warning) {
        warning.innerHTML =
          overflowWarningMarkup(quantity);
      }

      if (headerOrderValue) {
        headerOrderValue.textContent = quantity;
      }

      if (
        menuActionButton &&
        state.phase === "decision"
      ) {
        menuActionButton.setAttribute(
          "aria-label",
          `Confirm an order of ${quantity} cans and reveal actual demand`
        );

        const longText =
          menuActionButton.querySelector(".long-action");

        if (longText) {
          longText.textContent =
            `Confirm ${quantity} can${
              quantity === 1 ? "" : "s"
            } & reveal demand`;
        }
      }

      saveState();
    }

    /* =========================================================
       RESPONSIVE CANVAS CHART
       ========================================================= */
    function drawHistoryChart() {
      const canvas =
        document.getElementById("historyChart");

      if (!canvas) return;

      const rectangle =
        canvas.getBoundingClientRect();

      if (
        rectangle.width <= 0 ||
        rectangle.height <= 0
      ) {
        return;
      }

      const ratio =
        window.devicePixelRatio || 1;

      canvas.width = Math.max(
        1,
        Math.floor(rectangle.width * ratio)
      );

      canvas.height = Math.max(
        1,
        Math.floor(rectangle.height * ratio)
      );

      const context =
        canvas.getContext("2d");

      context.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

      context.clearRect(
        0,
        0,
        rectangle.width,
        rectangle.height
      );

      const history = state.history;
      const width = rectangle.width;
      const height = rectangle.height;

      const padding = {
        left: width < 440 ? 34 : 44,
        right: 14,
        top: 16,
        bottom: 30
      };

      const plotWidth =
        width - padding.left - padding.right;

      const plotHeight =
        height - padding.top - padding.bottom;

      const maxValue = Math.max(
        CONFIG.MAX_CAPACITY,
        CONFIG.MAX_DEMAND,
        ...history.map(item =>
          Math.max(
            item.demand,
            item.endingInventory,
            item.order
          )
        )
      );

      context.font =
        "11px system-ui, sans-serif";
      context.lineWidth = 1;
      context.textAlign = "right";
      context.textBaseline = "middle";

      const horizontalLines = 4;

      for (
        let index = 0;
        index <= horizontalLines;
        index++
      ) {
        const value = Math.round(
          (maxValue / horizontalLines) * index
        );

        const y =
          padding.top +
          plotHeight -
          (value / maxValue) * plotHeight;

        context.strokeStyle = "#dfe4ee";
        context.beginPath();
        context.moveTo(padding.left, y);
        context.lineTo(
          width - padding.right,
          y
        );
        context.stroke();

        context.fillStyle = "#687185";
        context.fillText(
          String(value),
          padding.left - 7,
          y
        );
      }

      if (!history.length) return;

      const xForDay = day =>
        padding.left +
        (
          (day - 0.5) /
          CONFIG.SIMULATION_DAYS
        ) *
          plotWidth;

      const yForValue = value =>
        padding.top +
        plotHeight -
        (value / maxValue) * plotHeight;

      const barWidth = Math.max(
        3,
        (
          plotWidth /
          CONFIG.SIMULATION_DAYS
        ) *
          0.55
      );

      history.forEach(item => {
        const x =
          xForDay(item.day) -
          barWidth / 2;

        const y =
          yForValue(item.order);

        context.fillStyle =
          "rgba(36, 119, 243, 0.35)";

        context.fillRect(
          x,
          y,
          barWidth,
          padding.top + plotHeight - y
        );
      });

      function drawLine(key, color) {
        context.strokeStyle = color;
        context.lineWidth = 2.5;
        context.lineJoin = "round";
        context.lineCap = "round";
        context.beginPath();

        history.forEach((item, index) => {
          const x = xForDay(item.day);
          const y = yForValue(item[key]);

          if (index === 0) {
            context.moveTo(x, y);
          } else {
            context.lineTo(x, y);
          }
        });

        context.stroke();

        history.forEach(item => {
          context.fillStyle = color;
          context.beginPath();
          context.arc(
            xForDay(item.day),
            yForValue(item[key]),
            2.7,
            0,
            Math.PI * 2
          );
          context.fill();
        });
      }

      drawLine("demand", "#e93f82");
      drawLine("endingInventory", "#0ca875");

      history.forEach(item => {
        if (item.lostSales <= 0) return;

        const x = xForDay(item.day);
        const y = yForValue(item.demand);

        context.strokeStyle = "#bc2945";
        context.lineWidth = 2.5;
        context.beginPath();
        context.moveTo(x - 5, y - 5);
        context.lineTo(x + 5, y + 5);
        context.moveTo(x + 5, y - 5);
        context.lineTo(x - 5, y + 5);
        context.stroke();
      });

      context.fillStyle = "#687185";
      context.textAlign = "center";
      context.textBaseline = "top";

      const labelDays =
        width < 500
          ? [1, 10, 20, 30]
          : [1, 5, 10, 15, 20, 25, 30];

      labelDays.forEach(day => {
        context.fillText(
          String(day),
          xForDay(day),
          padding.top + plotHeight + 8
        );
      });
    }

    /* =========================================================
       MODALS
       ========================================================= */
    function openModal(
      content,
      initialFocusSelector = null
    ) {
      lastModalFocus = document.activeElement;
      modal.innerHTML = content;
      modalLayer.hidden = false;
      document.body.style.overflow = "hidden";

      const focusTarget =
        (
          initialFocusSelector &&
          modal.querySelector(initialFocusSelector)
        ) ||
        modal.querySelector(
          "button, input, [tabindex='0']"
        );

      if (focusTarget) {
        requestAnimationFrame(() => {
          focusTarget.focus();
        });
      }
    }

    function closeModal() {
      modalLayer.hidden = true;
      modal.innerHTML = "";
      document.body.style.overflow = "";

      if (
        lastModalFocus &&
        typeof lastModalFocus.focus === "function" &&
        document.contains(lastModalFocus)
      ) {
        lastModalFocus.focus();
      }
    }

    function showTutorialModal(step = 0) {
      const slides = [
        {
          icon: "🥤",
          title: "Keep customers supplied",
          copy: "Run this popular cola machine for 30 simulated days. Use each forecast and decide how many cans to order.",
          list: [
            "Customers buy from the cans currently on hand.",
            "Demand that cannot be served becomes lost sales.",
            "There is no timer—plan at your own pace."
          ]
        },
        {
          icon: "🚚",
          title: "Deliveries take two days",
          copy: "An order placed on Day 1 arrives at the start of Day 3. Waiting until the machine is empty is usually too late.",
          list: [
            "On hand means cans physically in the machine.",
            "Inventory position means on hand plus incoming cans.",
            "The top menu always shows your order controls."
          ]
        },
        {
          icon: "⚖️",
          title: "Balance service and cost",
          copy: "More stock protects customer satisfaction, but ordering and holding cans costs money. Forecasts and safety stock help you find a balance.",
          list: [
            `Orders cost ${formatCurrency(CONFIG.PURCHASE_COST)} per can plus a ${formatCurrency(CONFIG.FIXED_DELIVERY_COST)} delivery fee.`,
            `Leftover cans cost ${formatCurrency(CONFIG.DAILY_HOLDING_COST)} each per day.`,
            `Each unmet can adds a ${formatCurrency(CONFIG.STOCKOUT_PENALTY)} penalty.`
          ]
        }
      ];

      const slide = slides[step];

      const dots = slides.map((_, index) => `
        <span class="tutorial-dot ${
          index === step ? "active" : ""
        }"></span>
      `).join("");

      openModal(`
        <button
          id="tutorialCloseButton"
          class="modal-close"
          type="button"
          aria-label="Close instructions"
        >×</button>

        <div class="modal-illustration" aria-hidden="true">
          ${slide.icon}
        </div>

        <h2 id="modalTitle">${slide.title}</h2>
        <p class="modal-main-copy">${slide.copy}</p>

        <ul class="tutorial-list">
          ${slide.list.map(item => `
            <li>${item}</li>
          `).join("")}
        </ul>

        <div
          class="tutorial-progress"
          aria-label="Tutorial step ${step + 1} of 3"
        >
          ${dots}
        </div>

        <div class="modal-actions">
          ${
            step > 0
              ? `
                <button
                  id="tutorialBackButton"
                  class="secondary-button"
                  type="button"
                >
                  Back
                </button>
              `
              : ""
          }

          <button
            id="tutorialNextButton"
            class="primary-button"
            type="button"
          >
            ${
              step === slides.length - 1
                ? "Start playing"
                : "Next"
            }
          </button>
        </div>
      `, "#tutorialNextButton");

      document
        .getElementById("tutorialCloseButton")
        .addEventListener("click", () => {
          state.tutorialSeen = true;
          saveState();
          closeModal();
        });

      const backButton =
        document.getElementById("tutorialBackButton");

      if (backButton) {
        backButton.addEventListener("click", () => {
          showTutorialModal(step - 1);
        });
      }

      document
        .getElementById("tutorialNextButton")
        .addEventListener("click", () => {
          if (step < slides.length - 1) {
            showTutorialModal(step + 1);
          } else {
            state.tutorialSeen = true;
            saveState();
            closeModal();
            app.focus();
          }
        });
    }

    function showWelcomeBackModal() {
      const completed =
        state.phase === "ended";

      openModal(`
        <div class="modal-illustration" aria-hidden="true">
          ${completed ? "🏆" : "🥫"}
        </div>

        <h2 id="modalTitle">
          ${completed ? "Welcome back" : "Continue FizzFlow?"}
        </h2>

        <p class="modal-main-copy">
          ${
            completed
              ? "Your completed 30-day report is saved and ready to view."
              : `Your saved game is on Day ${state.day}, with ${state.history.length} completed day${state.history.length === 1 ? "" : "s"}.`
          }
        </p>

        <div class="modal-actions">
          <button
            id="continueSavedButton"
            class="primary-button"
            type="button"
          >
            ${
              completed
                ? "View saved report"
                : "Continue saved game"
            }
          </button>

          <button
            id="welcomeNewButton"
            class="secondary-button"
            type="button"
          >
            New scenario
          </button>

          <button
            id="welcomeHowButton"
            class="ghost-button"
            type="button"
          >
            How to play
          </button>
        </div>
      `, "#continueSavedButton");

      document
        .getElementById("continueSavedButton")
        .addEventListener("click", closeModal);

      document
        .getElementById("welcomeNewButton")
        .addEventListener("click", () => {
          closeModal();
          startNewScenario(false);
        });

      document
        .getElementById("welcomeHowButton")
        .addEventListener("click", () => {
          showTutorialModal(0);
        });
    }

    function showConfirmation({
      title,
      copy,
      confirmText,
      onConfirm
    }) {
      openModal(`
        <button
          id="confirmCloseButton"
          class="modal-close"
          type="button"
          aria-label="Close confirmation"
        >×</button>

        <div class="modal-illustration" aria-hidden="true">?</div>

        <h2 id="modalTitle">${title}</h2>
        <p class="modal-main-copy">${copy}</p>

        <div class="modal-actions">
          <button
            id="confirmCancelButton"
            class="ghost-button"
            type="button"
          >
            Cancel
          </button>

          <button
            id="confirmActionButton"
            class="danger-button"
            type="button"
          >
            ${confirmText}
          </button>
        </div>
      `, "#confirmCancelButton");

      document
        .getElementById("confirmCloseButton")
        .addEventListener("click", closeModal);

      document
        .getElementById("confirmCancelButton")
        .addEventListener("click", closeModal);

      document
        .getElementById("confirmActionButton")
        .addEventListener("click", () => {
          closeModal();
          onConfirm();
        });
    }

    function showRestartConfirmation() {
      showConfirmation({
        title: "Restart this scenario?",
        copy: "Current progress will be replaced, but the same forecast and demand sequence will be used.",
        confirmText: "Restart scenario",
        onConfirm: restartCurrentScenario
      });
    }

    function showNewScenarioConfirmation() {
      showConfirmation({
        title: "Create a new scenario?",
        copy: "Current progress will be replaced with a newly generated 30-day demand sequence.",
        confirmText: "New scenario",
        onConfirm: () => startNewScenario(false)
      });
    }

    function getFocusableModalElements() {
      return [
        ...modal.querySelectorAll(
          "button:not([disabled]), input:not([disabled]), [href], [tabindex]:not([tabindex='-1'])"
        )
      ];
    }

    modalLayer.addEventListener("keydown", event => {
      if (modalLayer.hidden) return;

      if (event.key === "Escape") {
        event.preventDefault();
        closeModal();
        return;
      }

      if (event.key !== "Tab") return;

      const focusable =
        getFocusableModalElements();

      if (!focusable.length) return;

      const first = focusable[0];
      const last =
        focusable[focusable.length - 1];

      if (
        event.shiftKey &&
        document.activeElement === first
      ) {
        event.preventDefault();
        last.focus();
      } else if (
        !event.shiftKey &&
        document.activeElement === last
      ) {
        event.preventDefault();
        first.focus();
      }
    });

    modalLayer.addEventListener("mousedown", event => {
      if (event.target === modalLayer) {
        closeModal();
      }
    });

    /* =========================================================
       OPTIONAL LOCAL SOUND
       Disabled by default. No external audio is loaded.
       ========================================================= */
    function updateHeaderIcons() {
      const soundButton =
        document.getElementById("soundButton");

      const soundIcon =
        document.getElementById("soundIcon");

      soundButton.setAttribute(
        "aria-pressed",
        String(state.soundEnabled)
      );

      soundButton.setAttribute(
        "aria-label",
        state.soundEnabled
          ? "Turn sound off"
          : "Turn sound on"
      );

      soundButton.title =
        state.soundEnabled
          ? "Sound on"
          : "Sound off";

      soundIcon.innerHTML = state.soundEnabled
        ? `
          <svg viewBox="0 0 24 24">
            <path d="M5 9v6h4l5 4V5L9 9H5z"></path>
            <path d="M17 9a4 4 0 0 1 0 6"></path>
            <path d="M19 6.5a8 8 0 0 1 0 11"></path>
          </svg>
        `
        : `
          <svg viewBox="0 0 24 24">
            <path d="M5 9v6h4l5 4V5L9 9H5z"></path>
            <path d="M17 9l5 5"></path>
            <path d="M22 9l-5 5"></path>
          </svg>
        `;
    }

    function playSound(type) {
      if (!state.soundEnabled) return;

      try {
        if (!audioContext) {
          audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
          )();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        const now =
          audioContext.currentTime;

        const settings = {
          tap: {
            start: 330,
            end: 390,
            duration: 0.06
          },
          success: {
            start: 480,
            end: 720,
            duration: 0.16
          },
          stockout: {
            start: 240,
            end: 150,
            duration: 0.2
          },
          complete: {
            start: 520,
            end: 880,
            duration: 0.3
          }
        }[type] || {
          start: 330,
          end: 390,
          duration: 0.08
        };

        oscillator.type =
          type === "stockout"
            ? "triangle"
            : "sine";

        oscillator.frequency.setValueAtTime(
          settings.start,
          now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
          Math.max(1, settings.end),
          now + settings.duration
        );

        gain.gain.setValueAtTime(
          0.0001,
          now
        );

        gain.gain.exponentialRampToValueAtTime(
          0.055,
          now + 0.015
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + settings.duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(
          now + settings.duration + 0.02
        );
      } catch (error) {
        // Sound is optional; ignore unsupported audio.
      }
    }

    function showToast(message) {
      const toast =
        document.createElement("div");

      toast.className = "toast";
      toast.textContent = message;
      toastRegion.appendChild(toast);

      window.setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    /* =========================================================
       PERMANENT HEADER EVENTS
       ========================================================= */
    document
      .getElementById("howButton")
      .addEventListener("click", () => {
        showTutorialModal(0);
      });

    document
      .getElementById("restartButton")
      .addEventListener("click", () => {
        showRestartConfirmation();
      });

    document
      .getElementById("soundButton")
      .addEventListener("click", () => {
        state.soundEnabled =
          !state.soundEnabled;

        saveState();
        updateHeaderIcons();

        if (state.soundEnabled) {
          playSound("success");
          showToast("Sound is on.");
        } else {
          showToast("Sound is off.");
        }
      });

    document
      .getElementById("newButton")
      .addEventListener("click", () => {
        showNewScenarioConfirmation();
      });

    window.addEventListener("resize", () => {
      window.clearTimeout(chartResizeTimer);

      chartResizeTimer =
        window.setTimeout(
          drawHistoryChart,
          100
        );
    });

    /* =========================================================
       STARTUP
       ========================================================= */
    const savedState = loadSavedState();

    if (savedState) {
      state = savedState;
      render();
      showWelcomeBackModal();
    } else {
      state = createState(randomSeed());
      saveState();
      render();
      showTutorialModal(0);
    }
  </script>
</body>
