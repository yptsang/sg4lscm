<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#39198f">
  <title>FizzFlow: The Vending Machine Challenge</title>

  <style>
    /* =========================================================
       FIZZFLOW THEME
       Change these variables to quickly customize the appearance.
       ========================================================= */
    :root {
      --purple: #5428d8;
      --purple-dark: #321580;
      --purple-soft: #eee9ff;
      --pink: #e93f82;
      --cyan: #12b5d0;
      --blue: #2477f3;
      --green: #087e59;
      --green-bright: #0ca875;
      --green-soft: #dcf8ec;
      --yellow: #ffd45a;
      --orange: #e77527;
      --red: #bc2945;
      --red-soft: #ffeaee;
      --ink: #182239;
      --muted: #5d687e;
      --surface: #ffffff;
      --surface-soft: #f5f7fc;
      --border: #dbe1ec;
      --shadow: 0 15px 38px rgba(37, 27, 81, 0.12);
      --small-shadow: 0 7px 20px rgba(37, 27, 81, 0.09);
      --radius: 20px;
      --focus: #ffb700;
      --header-height: 122px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      color-scheme: light;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 212, 90, 0.27), transparent 25rem),
        radial-gradient(circle at 95% 5%, rgba(18, 181, 208, 0.18), transparent 26rem),
        linear-gradient(180deg, #f8f6ff 0%, #f4f8ff 45%, #f8fafc 100%);
      font-family:
        Inter, ui-rounded, "Segoe UI", system-ui, -apple-system,
        BlinkMacSystemFont, sans-serif;
      line-height: 1.45;
    }

    button,
    input {
      font: inherit;
    }

    button,
    input[type="range"] {
      touch-action: manipulation;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
    }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 4px solid rgba(255, 183, 0, 0.58);
      outline-offset: 3px;
    }

    button:disabled,
    input:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }

    .primary-button,
    .secondary-button,
    .ghost-button,
    .danger-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 48px;
      padding: 0.72rem 1rem;
      text-align: center;
    }

    .primary-button {
      color: white;
      background: linear-gradient(135deg, var(--purple), #7848eb);
      box-shadow: 0 8px 19px rgba(84, 40, 216, 0.25);
    }

    .primary-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(84, 40, 216, 0.31);
    }

    .secondary-button {
      color: var(--purple-dark);
      background: var(--purple-soft);
      border: 1px solid #d7ceff;
    }

    .ghost-button {
      color: var(--ink);
      background: white;
      border: 1px solid var(--border);
    }

    .danger-button {
      color: #8a1830;
      background: var(--red-soft);
      border: 1px solid #ffc2cd;
    }

    /* =========================================================
       STICKY MENU AND DAILY COMMAND BAR

       The player can order, reveal demand, and continue to the
       next day without scrolling back to a button in the page.
       ========================================================= */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      color: white;
      background: rgba(50, 21, 128, 0.98);
      box-shadow: 0 6px 22px rgba(28, 14, 74, 0.24);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      width: min(1220px, calc(100% - 1.4rem));
      margin: 0 auto;
      padding: 0.55rem 0 0.65rem;
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 0.65rem;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, 0.78);
      border-radius: 13px;
      color: white;
      background: linear-gradient(145deg, var(--pink), #fa7557);
      font-size: 1.3rem;
      font-weight: 950;
      transform: rotate(-4deg);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      display: block;
      overflow: hidden;
      font-size: 1.02rem;
      font-weight: 950;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-subtitle {
      display: block;
      margin-top: 0.08rem;
      color: #ddd5ff;
      font-size: 0.72rem;
    }

    .utility-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem;
    }

    .utility-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-width: 44px;
      min-height: 44px;
      padding: 0.5rem 0.65rem;
      color: white;
      background: rgba(255, 255, 255, 0.11);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .utility-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .utility-button svg {
      flex: 0 0 auto;
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .command-bar {
      display: grid;
      grid-template-columns: auto minmax(170px, 1fr);
      align-items: center;
      gap: 0.55rem;
      margin-top: 0.5rem;
      padding: 0.4rem;
      border: 1px solid rgba(255, 255, 255, 0.19);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.1);
    }

    .header-order-controls {
      display: grid;
      grid-template-columns: 44px 70px 44px;
      gap: 3px;
    }

    .header-order-button {
      min-width: 44px;
      min-height: 46px;
      color: var(--purple-dark);
      background: white;
      font-size: 1.3rem;
      line-height: 1;
    }

    .header-order-value {
      display: grid;
      min-height: 46px;
      place-items: center;
      border-radius: 10px;
      color: white;
      background: rgba(8, 5, 32, 0.28);
      text-align: center;
    }

    .header-order-value strong {
      display: block;
      font-size: 1.05rem;
      line-height: 1;
    }

    .header-order-value span {
      display: block;
      margin-top: 0.13rem;
      color: #e4ddff;
      font-size: 0.58rem;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .menu-action-button {
      width: 100%;
      min-height: 48px;
      padding: 0.65rem 0.8rem;
      color: #322000;
      background: linear-gradient(135deg, var(--yellow), #ffb842);
      box-shadow: 0 5px 13px rgba(18, 8, 62, 0.24);
      font-size: 0.95rem;
    }

    .menu-action-button:hover:not(:disabled) {
      background: linear-gradient(135deg, #ffe17b, #ffc454);
    }

    .command-status {
      min-width: 0;
      padding-left: 0.35rem;
    }

    .command-status strong {
      display: block;
      line-height: 1.15;
    }

    .command-status span {
      display: block;
      overflow: hidden;
      margin-top: 0.08rem;
      color: #ddd5ff;
      font-size: 0.72rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .short-action {
      display: none;
    }

    /* =========================================================
       GENERAL LAYOUT
       ========================================================= */
    main {
      width: min(1220px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1rem 0 4rem;
    }

    .card {
      border: 1px solid rgba(219, 225, 236, 0.95);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.97);
      box-shadow: var(--small-shadow);
    }

    .section-heading {
      margin: 0;
      font-size: clamp(1.12rem, 2vw, 1.42rem);
      line-height: 1.2;
    }

    .section-copy {
      margin: 0.3rem 0 0;
      color: var(--muted);
    }

    .eyebrow {
      display: block;
      margin-bottom: 0.22rem;
      color: var(--purple);
      font-size: 0.72rem;
      font-weight: 950;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .top-panel {
      padding: 0.9rem 1rem;
    }

    .day-heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .day-heading-row h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      line-height: 1.05;
    }

    .seed-label {
      flex: 0 0 auto;
      padding: 0.4rem 0.62rem;
      border-radius: 999px;
      color: #4e4268;
      background: #f1eef9;
      font-size: 0.74rem;
      font-weight: 800;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 0.7rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 750;
    }

    .day-progress {
      display: grid;
      grid-template-columns: repeat(30, minmax(5px, 1fr));
      gap: 3px;
      margin-top: 0.3rem;
    }

    .progress-day {
      height: 9px;
      border-radius: 999px;
      background: #e5e9f2;
    }

    .progress-day.done {
      background: var(--green-bright);
    }

    .progress-day.current {
      background: var(--yellow);
      box-shadow: 0 0 0 2px #9e6d00;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.65rem;
      margin-top: 0.72rem;
    }

    .stat-card {
      min-height: 88px;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: white;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 850;
    }

    .stat-icon {
      margin-right: 0.2rem;
      font-size: 1rem;
    }

    .stat-value {
      display: block;
      margin-top: 0.14rem;
      font-size: clamp(1.18rem, 3vw, 1.65rem);
      font-weight: 950;
      line-height: 1.1;
    }

    .stat-note {
      display: block;
      margin-top: 0.17rem;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .positive {
      color: var(--green) !important;
    }

    .negative {
      color: var(--red) !important;
    }

    .arrival-banner,
    .info-banner,
    .warning-banner,
    .success-banner {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      margin-top: 0.72rem;
      padding: 0.72rem 0.8rem;
      border-radius: 14px;
      font-size: 0.86rem;
    }

    .arrival-banner,
    .success-banner {
      color: #07563e;
      background: var(--green-soft);
      border: 1px solid #a5e8d0;
    }

    .info-banner {
      color: #263b6c;
      background: #eaf2ff;
      border: 1px solid #bfd4ff;
    }

    .warning-banner {
      color: #75400e;
      background: #fff2d7;
      border: 1px solid #ffd58d;
    }

    .banner-icon {
      flex: 0 0 auto;
      font-size: 1.05rem;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(250px, 0.72fr) minmax(0, 1.28fr);
      gap: 1rem;
      align-items: start;
      margin-top: 1rem;
    }

    .right-column {
      display: grid;
      gap: 0.85rem;
      min-width: 0;
    }

    /* =========================================================
       FORECAST CARDS
       ========================================================= */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
    }

    .forecast-card {
      min-height: 118px;
      padding: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: white;
      box-shadow: var(--small-shadow);
    }

    .forecast-icon {
      display: block;
      margin-bottom: 0.2rem;
      font-size: 1.4rem;
    }

    .forecast-card strong {
      display: block;
      font-size: 0.96rem;
    }

    .forecast-card p {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .forecast-main {
      color: white;
      background: linear-gradient(145deg, var(--blue), var(--cyan));
      border-color: transparent;
    }

    .forecast-main p,
    .forecast-main .eyebrow {
      color: rgba(255, 255, 255, 0.88);
    }

    .forecast-range {
      display: block;
      margin-top: 0.12rem;
      font-size: clamp(1.25rem, 3vw, 1.7rem) !important;
      font-weight: 950;
    }

    /* =========================================================
       VENDING MACHINE
       ========================================================= */
    .machine-card {
      padding: 0.9rem;
    }

    .vending-scene {
      position: relative;
      max-width: 330px;
      margin: 0.7rem auto 0;
      padding: 11px 11px 16px;
      border: 5px solid #291666;
      border-radius: 26px 26px 20px 20px;
      background: linear-gradient(150deg, #7151ed, #4222b7);
      box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.12),
        0 14px 27px rgba(50, 21, 128, 0.2);
    }

    .machine-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.48rem 0.58rem;
      border-radius: 13px;
      color: white;
      background: linear-gradient(135deg, var(--pink), #f85f5b);
      font-size: 0.9rem;
      font-weight: 950;
    }

    .machine-light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9bffcf;
      box-shadow: 0 0 9px #9bffcf;
    }

    .machine-window {
      margin-top: 0.55rem;
      padding: 0.48rem;
      border: 3px solid #20114e;
      border-radius: 15px;
      background: #151a3b;
    }

    .can-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      min-height: 224px;
    }

    .can-slot {
      position: relative;
      min-height: 24px;
      border: 1px dashed rgba(255, 255, 255, 0.13);
      border-radius: 7px 7px 5px 5px;
      background: rgba(255, 255, 255, 0.05);
    }

    .can-slot.filled {
      overflow: hidden;
      border: 1px solid #ff9db1;
      background: linear-gradient(90deg, #af183e, #ee4264 48%, #af183e);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55);
      animation: canIn 280ms ease both;
    }

    .can-slot.filled::before {
      content: "F";
      position: absolute;
      inset: 18% 0 auto;
      color: white;
      text-align: center;
      font-size: clamp(0.62rem, 2vw, 0.9rem);
      font-style: italic;
      font-weight: 950;
    }

    .can-slot.filled::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 22%;
      width: 56%;
      height: 2px;
      border-radius: 999px;
      background: #ffd4dc;
    }

    .machine-bottom {
      display: grid;
      grid-template-columns: 1fr 50px;
      gap: 0.6rem;
      margin-top: 0.55rem;
    }

    .dispenser {
      height: 35px;
      border: 4px solid #1d1148;
      border-radius: 9px;
      background: #0c0e20;
    }

    .machine-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }

    .machine-buttons span {
      border-radius: 4px;
      background: var(--yellow);
      box-shadow: inset 0 -2px 0 #ae7600;
    }

    .machine-legs {
      display: flex;
      justify-content: space-between;
      width: 80%;
      margin: 0 auto;
    }

    .machine-legs span {
      width: 32px;
      height: 7px;
      border-radius: 0 0 7px 7px;
      background: #25145a;
    }

    .stock-caption {
      margin-top: 0.65rem;
      text-align: center;
      font-weight: 850;
    }

    .stock-caption span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .pipeline {
      margin-top: 0.8rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .pipeline h3 {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      font-size: 0.96rem;
    }

    .pipeline-list {
      display: grid;
      gap: 0.42rem;
      margin: 0.55rem 0 0;
      padding: 0;
      list-style: none;
    }

    .pipeline-item,
    .pipeline-empty {
      padding: 0.62rem 0.68rem;
      border-radius: 11px;
      background: var(--surface-soft);
      font-size: 0.8rem;
    }

    .pipeline-item {
      display: flex;
      justify-content: space-between;
      gap: 0.4rem;
      border-left: 4px solid var(--cyan);
    }

    .pipeline-empty {
      color: var(--muted);
    }

    /* =========================================================
       ORDER DECISION
       These larger controls stay synchronized with the menu bar.
       ========================================================= */
    .decision-card,
    .result-card {
      padding: 0.9rem;
    }

    .decision-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.7rem;
    }

    .cost-chip {
      flex: 0 0 auto;
      padding: 0.36rem 0.55rem;
      border-radius: 999px;
      color: #624000;
      background: #fff0c1;
      font-size: 0.72rem;
      font-weight: 850;
    }

    .order-stepper {
      display: grid;
      grid-template-columns: 56px minmax(86px, 125px) 56px;
      justify-content: center;
      gap: 0.65rem;
      margin-top: 0.8rem;
    }

    .step-button {
      min-height: 56px;
      color: white;
      background: var(--purple);
      font-size: 1.6rem;
      line-height: 1;
    }

    .quantity-input {
      width: 100%;
      min-height: 56px;
      border: 2px solid #c8c1e7;
      border-radius: 13px;
      color: var(--ink);
      background: white;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 950;
    }

    .slider-wrap {
      margin-top: 0.75rem;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.25rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
    }

    input[type="range"] {
      width: 100%;
      min-height: 44px;
      accent-color: var(--purple);
    }

    .order-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem;
      margin-top: 0.55rem;
    }

    .mini-metric {
      padding: 0.58rem;
      border-radius: 11px;
      background: var(--surface-soft);
      text-align: center;
    }

    .mini-metric span {
      display: block;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 800;
    }

    .mini-metric strong {
      display: block;
      margin-top: 0.1rem;
      font-size: 0.94rem;
    }

    .menu-instruction {
      margin: 0.55rem 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.76rem;
    }

    /* =========================================================
       DAILY RESULT
       ========================================================= */
    .result-hero {
      padding: 0.9rem;
      border-radius: 17px;
      background: linear-gradient(135deg, #f0ecff, #e8f8ff);
    }

    .result-hero.stockout {
      background: linear-gradient(135deg, #fff0f3, #fff6dc);
    }

    .result-demand {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.7rem;
    }

    .result-demand strong {
      font-size: clamp(1.65rem, 5vw, 2.35rem);
    }

    .result-message {
      margin: 0.4rem 0 0;
      font-weight: 850;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
      margin-top: 0.65rem;
    }

    .result-metric {
      padding: 0.65rem;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: white;
    }

    .result-metric span {
      display: block;
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 800;
    }

    .result-metric strong {
      display: block;
      margin-top: 0.15rem;
      font-size: 1.02rem;
    }

    .cost-breakdown {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.4rem;
      margin-top: 0.65rem;
    }

    .cost-item {
      padding: 0.55rem 0.4rem;
      border-radius: 11px;
      color: #594568;
      background: #f7f3fb;
      text-align: center;
      font-size: 0.68rem;
    }

    .cost-item strong {
      display: block;
      margin-top: 0.08rem;
      color: var(--ink);
      font-size: 0.82rem;
    }

    /* =========================================================
       CHART AND LOG
       ========================================================= */
    .chart-card,
    .history-card,
    .report-section {
      margin-top: 1rem;
      padding: 0.9rem;
    }

    .chart-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.35rem 0.75rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .legend-demand {
      background: var(--pink);
    }

    .legend-stock {
      background: var(--green-bright);
    }

    .legend-order {
      background: rgba(36, 119, 243, 0.45);
    }

    .legend-stockout {
      display: grid;
      place-items: center;
      color: var(--red);
      font-weight: 950;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 250px;
      margin-top: 0.6rem;
    }

    #historyChart {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 13px;
      background: linear-gradient(180deg, #fbfcff, #f6f8fc);
    }

    .chart-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      pointer-events: none;
    }

    details {
      margin-top: 0.5rem;
    }

    summary {
      min-height: 44px;
      padding: 0.65rem 0;
      cursor: pointer;
      color: var(--purple-dark);
      font-weight: 850;
    }

    .log-head,
    .log-row {
      display: grid;
      grid-template-columns: 0.55fr 1fr 0.72fr 0.72fr 0.72fr 0.9fr 1fr;
      gap: 0.4rem;
      align-items: center;
    }

    .log-head {
      padding: 0.55rem;
      border-radius: 10px;
      color: white;
      background: var(--purple-dark);
      font-size: 0.7rem;
      font-weight: 850;
    }

    .log-row {
      margin-top: 0.3rem;
      padding: 0.56rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      font-size: 0.76rem;
    }

    .log-row.stockout-row {
      border-left: 5px solid var(--red);
    }

    /* =========================================================
       FINAL REPORT
       ========================================================= */
    .results-page {
      display: grid;
      gap: 1rem;
    }

    .score-hero {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.15rem;
      align-items: center;
      padding: clamp(1rem, 4vw, 1.5rem);
      color: white;
      background:
        radial-gradient(circle at 90% 10%, rgba(255, 212, 90, 0.36), transparent 15rem),
        linear-gradient(135deg, var(--purple-dark), var(--purple));
    }

    .score-ring {
      display: grid;
      width: 138px;
      height: 138px;
      place-items: center;
      border: 9px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.09);
    }

    .score-ring strong {
      display: block;
      font-size: 2.55rem;
      line-height: 1;
      text-align: center;
    }

    .score-ring span {
      display: block;
      color: #e6e0ff;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .score-copy h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.9rem);
      line-height: 1.05;
    }

    .score-copy p {
      max-width: 690px;
      margin: 0.5rem 0 0;
      color: #ece8ff;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.65rem;
    }

    .report-stat {
      min-height: 108px;
      padding: 0.82rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: white;
      box-shadow: var(--small-shadow);
    }

    .report-stat span {
      display: block;
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 850;
    }

    .report-stat strong {
      display: block;
      margin-top: 0.22rem;
      font-size: clamp(1.2rem, 3vw, 1.62rem);
    }

    .report-stat small {
      display: block;
      margin-top: 0.15rem;
      color: var(--muted);
    }

    .day-highlights {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
      margin-top: 0.7rem;
    }

    .highlight-card {
      padding: 0.82rem;
      border-radius: 14px;
      background: var(--surface-soft);
    }

    .highlight-card strong {
      display: block;
      margin-bottom: 0.22rem;
    }

    .highlight-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .benchmark-grid {
      display: grid;
      grid-template-columns: minmax(125px, 1.2fr) 1fr 1fr;
      margin-top: 0.75rem;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .benchmark-cell {
      min-width: 0;
      padding: 0.68rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .benchmark-cell:nth-last-child(-n + 3) {
      border-bottom: 0;
    }

    .benchmark-head {
      color: white;
      background: var(--purple-dark);
      font-weight: 850;
    }

    .benchmark-label {
      color: var(--muted);
      background: #fafbfe;
      font-weight: 850;
    }

    .benchmark-value {
      text-align: center;
      font-weight: 850;
    }

    .results-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .results-actions button {
      flex: 1 1 190px;
    }

    /* =========================================================
       MODALS AND TOASTS
       ========================================================= */
    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(20, 13, 50, 0.7);
      backdrop-filter: blur(6px);
    }

    .modal-layer[hidden] {
      display: none;
    }

    .modal {
      width: min(540px, 100%);
      max-height: min(720px, calc(100vh - 2rem));
      overflow-y: auto;
      padding: clamp(1rem, 4vw, 1.35rem);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 23px;
      background: white;
      box-shadow: 0 25px 68px rgba(19, 11, 57, 0.34);
    }

    .modal-close {
      float: right;
      width: 44px;
      min-height: 44px;
      margin: -0.25rem -0.25rem 0 0.45rem;
      color: var(--ink);
      background: var(--surface-soft);
      font-size: 1.2rem;
    }

    .modal-illustration {
      display: grid;
      width: 78px;
      height: 78px;
      margin: 0 auto 0.75rem;
      place-items: center;
      border-radius: 23px;
      color: white;
      background: linear-gradient(145deg, var(--pink), var(--purple));
      font-size: 2.35rem;
      box-shadow: 0 10px 23px rgba(84, 40, 216, 0.23);
    }

    .modal h2 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.4rem, 5vw, 1.95rem);
    }

    .modal-main-copy {
      color: var(--muted);
      text-align: center;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.9rem;
    }

    .modal-actions button {
      flex: 1 1 140px;
    }

    .tutorial-list {
      display: grid;
      gap: 0.48rem;
      margin: 0.75rem 0 0;
      padding: 0;
      list-style: none;
    }

    .tutorial-list li {
      padding: 0.68rem;
      border-radius: 12px;
      background: var(--surface-soft);
    }

    .tutorial-progress {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin: 0.9rem 0;
    }

    .tutorial-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #dfe2eb;
    }

    .tutorial-dot.active {
      background: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-soft);
    }

    .toast-region {
      position: fixed;
      z-index: 120;
      right: 1rem;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      display: grid;
      width: min(360px, calc(100% - 2rem));
      gap: 0.45rem;
      pointer-events: none;
    }

    .toast {
      padding: 0.78rem 0.86rem;
      border: 1px solid #bcd7ff;
      border-radius: 13px;
      color: #203765;
      background: white;
      box-shadow: var(--shadow);
      animation: toastIn 220ms ease both;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @keyframes canIn {
      from {
        opacity: 0;
        transform: translateY(-5px) scale(0.87);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       TABLET LAYOUT
       ========================================================= */
    @media (max-width: 900px) {
      .utility-text {
        display: none;
      }

      .utility-button {
        padding: 0.45rem;
      }

      .stats-grid,
      .report-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .game-layout {
        grid-template-columns: 1fr;
      }

      /* Decision and forecast appear before the machine on phones/tablets. */
      .right-column {
        order: 1;
      }

      .machine-card {
        order: 2;
        display: grid;
        grid-template-columns: minmax(220px, 0.7fr) minmax(180px, 0.3fr);
        gap: 0.9rem;
        align-items: center;
      }

      .pipeline {
        margin: 0;
        padding: 0;
        border: 0;
      }
    }

    /* =========================================================
       PHONE LAYOUT
       ========================================================= */
    @media (max-width: 650px) {
      :root {
        --header-height: 112px;
      }

      .header-inner {
        width: calc(100% - 0.8rem);
        padding-top: 0.4rem;
        padding-bottom: 0.45rem;
      }

      .brand-subtitle {
        display: none;
      }

      .utility-nav {
        gap: 0.22rem;
      }

      .utility-button {
        width: 44px;
        padding: 0;
      }

      .command-bar {
        grid-template-columns: auto minmax(0, 1fr);
        gap: 0.35rem;
        margin-top: 0.4rem;
        padding: 0.3rem;
      }

      .header-order-controls {
        grid-template-columns: 44px 52px 44px;
        gap: 2px;
      }

      .header-order-value span {
        font-size: 0.52rem;
      }

      .menu-action-button {
        min-width: 0;
        padding-inline: 0.45rem;
      }

      .long-action {
        display: none;
      }

      .short-action {
        display: inline;
      }

      main {
        width: min(100% - 0.8rem, 1220px);
        padding-top: 0.45rem;
      }

      .day-progress {
        grid-template-columns: repeat(15, 1fr);
        row-gap: 4px;
      }

      .forecast-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .forecast-main {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .machine-card {
        display: block;
      }

      .pipeline {
        margin-top: 0.8rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border);
      }

      .result-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .cost-breakdown {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chart-header {
        display: block;
      }

      .chart-legend {
        justify-content: flex-start;
        margin-top: 0.45rem;
      }

      .log-head {
        display: none;
      }

      .log-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
      }

      .log-row > span::before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 0.62rem;
        font-weight: 850;
        text-transform: uppercase;
      }

      .score-hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .score-ring {
        margin: 0 auto;
      }

      .day-highlights {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      .brand-copy {
        display: none;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
      }

      .header-main {
        gap: 0.35rem;
      }

      .seed-label {
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .order-preview {
        grid-template-columns: 1fr;
      }

      .benchmark-cell {
        padding: 0.55rem 0.3rem;
        font-size: 0.72rem;
      }
    }

    @media (max-width: 350px) {
      .header-inner {
        width: calc(100% - 0.5rem);
      }

      .utility-nav {
        gap: 0.1rem;
      }

      .header-order-controls {
        grid-template-columns: 44px 48px 44px;
      }

      .menu-action-button {
        font-size: 0.82rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-main">
        <div class="brand" aria-label="FizzFlow: The Vending Machine Challenge">
          <div class="brand-mark" aria-hidden="true">Inv</div>
          <div class="brand-copy">
            <span class="brand-title">FizzFlow</span>
            <span class="brand-subtitle">The Vending Machine Challenge</span>
          </div>
        </div>

        <nav class="utility-nav" aria-label="Game options">
          <button
            id="howButton"
            class="utility-button"
            type="button"
            aria-label="How to play"
            title="How to play"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M9.8 9a2.3 2.3 0 1 1 3.8 1.8c-1 .7-1.6 1.1-1.6 2.2"></path>
              <path d="M12 17h.01"></path>
            </svg>
            <span class="utility-text">How to play</span>
          </button>

          <button
            id="restartButton"
            class="utility-button"
            type="button"
            aria-label="Restart current scenario"
            title="Restart current scenario"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4v6h6"></path>
              <path d="M5.5 15a8 8 0 1 0 1-8.5L4 10"></path>
            </svg>
            <span class="utility-text">Restart</span>
          </button>

          <button
            id="soundButton"
            class="utility-button"
            type="button"
            aria-label="Turn sound on"
            title="Sound off"
            aria-pressed="false"
          >
            <span id="soundIcon" aria-hidden="true"></span>
          </button>

          <button
            id="newButton"
            class="utility-button"
            type="button"
            aria-label="Create a new scenario"
            title="New scenario"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="3"></rect>
              <circle cx="9" cy="9" r="1"></circle>
              <circle cx="15" cy="15" r="1"></circle>
              <circle cx="15" cy="9" r="1"></circle>
              <circle cx="9" cy="15" r="1"></circle>
            </svg>
          </button>
        </nav>
      </div>

      <!-- Dynamically changes between ordering, revealing and continuing. -->
      <div id="commandBar" class="command-bar" aria-label="Daily game controls"></div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="modalLayer" class="modal-layer" hidden>
    <section
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    ></section>
  </div>

  <div
    id="toastRegion"
    class="toast-region"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <script>
    "use strict";

    /* =========================================================
       EASY-TO-EDIT GAME CONFIGURATION
       All monetary values are in dollars.
       ========================================================= */
    const CONFIG = Object.freeze({
      VERSION: 2,
      STORAGE_KEY: "fizzflow-save-v2",

      SIMULATION_DAYS: 30,
      INITIAL_INVENTORY: 20,
      MAX_CAPACITY: 40,
      DELIVERY_LEAD_TIME: 2,
      MAX_ORDER_QUANTITY: 40,

      SELLING_PRICE: 3.00,
      PURCHASE_COST: 1.20,
      FIXED_DELIVERY_COST: 2.00,
      DAILY_HOLDING_COST: 0.08,
      STOCKOUT_PENALTY: 0.75,

      MIN_DEMAND: 1,
      MAX_DEMAND: 20,

      BENCHMARK_REORDER_POINT: 16,
      BENCHMARK_ORDER_UP_TO: 28
    });

    const app = document.getElementById("app");
    const commandBar = document.getElementById("commandBar");
    const modalLayer = document.getElementById("modalLayer");
    const modal = document.getElementById("modal");
    const toastRegion = document.getElementById("toastRegion");

    const currencyFormatter = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD"
    });

    let state;
    let lastModalFocus = null;
    let chartResizeTimer = null;
    let audioContext = null;

    /* =========================================================
       GENERAL UTILITIES
       ========================================================= */
    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function roundMoney(value) {
      return Math.round((value + Number.EPSILON) * 100) / 100;
    }

    function formatCurrency(value) {
      const absoluteValue = Math.abs(roundMoney(value));
      return value < 0
        ? "-" + currencyFormatter.format(absoluteValue)
        : currencyFormatter.format(absoluteValue);
    }

    function formatPercent(value, digits = 1) {
      return `${Number(value).toFixed(digits)}%`;
    }

    function serviceLevel(metrics) {
      return metrics.demand > 0
        ? (metrics.sold / metrics.demand) * 100
        : 100;
    }

    function totalCosts(metrics) {
      return roundMoney(
        metrics.purchaseCost +
        metrics.fixedCost +
        metrics.holdingCost +
        metrics.stockoutPenalty
      );
    }

    function randomSeed() {
      if (window.crypto && window.crypto.getRandomValues) {
        const values = new Uint32Array(1);
        window.crypto.getRandomValues(values);
        return values[0] || 1;
      }

      return (
        Date.now() ^
        Math.floor(Math.random() * 0xffffffff)
      ) >>> 0;
    }

    // Repeatable seeded random-number generator.
    function seededRandom(seed) {
      let current = seed >>> 0;

      return function () {
        current += 0x6D2B79F5;
        let value = current;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
    }

    function chooseWeighted(random, options) {
      const roll = random();
      let total = 0;

      for (const option of options) {
        total += option.weight;
        if (roll <= total) return option;
      }

      return options[options.length - 1];
    }

    /* =========================================================
       SEEDED SCENARIO GENERATION
       Exact demand is generated once but hidden until the day runs.
       ========================================================= */
    function generateScenario(seed) {
      const random = seededRandom(seed);

      const weekdays = [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
      ];

      const weatherOptions = [
        {
          name: "Hot",
          icon: "☀️",
          effect: 3,
          weight: 0.18,
          text: "Hot weather usually increases drink sales."
        },
        {
          name: "Sunny",
          icon: "🌤️",
          effect: 1,
          weight: 0.29,
          text: "Pleasant weather can give sales a small lift."
        },
        {
          name: "Mild",
          icon: "⛅",
          effect: 0,
          weight: 0.27,
          text: "Mild weather usually keeps demand near normal."
        },
        {
          name: "Rainy",
          icon: "🌧️",
          effect: -2,
          weight: 0.18,
          text: "Rain often means fewer people visit the machine."
        },
        {
          name: "Cool",
          icon: "🧥",
          effect: -1,
          weight: 0.08,
          text: "Cool weather can slightly reduce cold-drink sales."
        }
      ];

      const scenario = [];

      for (let day = 1; day <= CONFIG.SIMULATION_DAYS; day++) {
        const weekday = weekdays[(day - 1) % 7];
        const weekend = weekday === "Saturday" || weekday === "Sunday";
        const weather = chooseWeighted(random, weatherOptions);

        let event = {
          name: weekend ? "Weekend lull" : "Regular school day",
          icon: weekend ? "🏫" : "📚",
          effect: weekend ? -1 : 0,
          text: weekend
            ? "The campus is quieter at the weekend."
            : "No unusual event is expected today."
        };

        const eventRoll = random();

        if (eventRoll < 0.07) {
          event = {
            name: "Sports day",
            icon: "🏅",
            effect: 5,
            text: "Sports day can create a strong rush of thirsty customers."
          };
        } else if (eventRoll < 0.13) {
          event = {
            name: "Campus event",
            icon: "🎪",
            effect: 4,
            text: "A campus event is likely to bring extra visitors."
          };
        } else if (eventRoll < 0.17) {
          event = {
            name: "Evening concert",
            icon: "🎵",
            effect: 6,
            text: "The concert may create unusually high demand."
          };
        } else if (eventRoll < 0.22) {
          event = {
            name: "Holiday",
            icon: "🌴",
            effect: -3,
            text: "A holiday means fewer people are around."
          };
        } else if (eventRoll < 0.27) {
          event = {
            name: "Quiet study day",
            icon: "🤫",
            effect: -2,
            text: "A quiet day is expected to reduce passing traffic."
          };
        }

        const normalBase = 7 + Math.floor(random() * 3);

        const expected = clamp(
          Math.round(normalBase + weather.effect + event.effect),
          CONFIG.MIN_DEMAND + 1,
          CONFIG.MAX_DEMAND - 2
        );

        // Two small random movements create understandable uncertainty.
        const variation =
          Math.floor(random() * 3) - 1 +
          Math.floor(random() * 3) - 1;

        const demand = clamp(
          Math.round(expected + variation),
          CONFIG.MIN_DEMAND,
          CONFIG.MAX_DEMAND
        );

        const forecastLow = clamp(
          expected - 2,
          CONFIG.MIN_DEMAND,
          CONFIG.MAX_DEMAND
        );

        const forecastHigh = clamp(
          expected + 2,
          CONFIG.MIN_DEMAND,
          CONFIG.MAX_DEMAND
        );

        let explanation = weather.text;

        if (Math.abs(event.effect) >= 3) {
          explanation = `${weather.text} ${event.text}`;
        }

        scenario.push({
          day,
          weekday,
          weekend,
          weather,
          event,
          expected,
          forecastLow,
          forecastHigh,
          explanation,
          demand
        });
      }

      return scenario;
    }

    /* =========================================================
       STATE AND PERSISTENCE
       ========================================================= */
    function emptyMetrics() {
      return {
        revenue: 0,
        purchaseCost: 0,
        fixedCost: 0,
        holdingCost: 0,
        stockoutPenalty: 0,
        profit: 0,
        sold: 0,
        demand: 0,
        lost: 0,
        stockoutDays: 0,
        endingInventorySum: 0,
        rejected: 0,
        ordersPlaced: 0
      };
    }

    function createState(seed) {
      return {
        version: CONFIG.VERSION,
        seed,
        scenario: generateScenario(seed),
        day: 1,
        phase: "decision",
        onHand: CONFIG.INITIAL_INVENTORY,
        pipeline: [],
        orderQty: 0,
        todayArrival: {
          scheduled: 0,
          accepted: 0,
          rejected: 0
        },
        history: [],
        metrics: emptyMetrics(),
        soundEnabled: false,
        tutorialSeen: false
      };
    }

    function isValidSavedState(candidate) {
      return Boolean(
        candidate &&
        candidate.version === CONFIG.VERSION &&
        Number.isInteger(candidate.seed) &&
        Array.isArray(candidate.scenario) &&
        candidate.scenario.length === CONFIG.SIMULATION_DAYS &&
        Array.isArray(candidate.history) &&
        candidate.metrics
      );
    }

    function hydrateState(candidate) {
      candidate.pipeline = Array.isArray(candidate.pipeline)
        ? candidate.pipeline
        : [];

      candidate.orderQty = clamp(
        Number(candidate.orderQty) || 0,
        0,
        CONFIG.MAX_ORDER_QUANTITY
      );

      candidate.todayArrival = candidate.todayArrival || {
        scheduled: 0,
        accepted: 0,
        rejected: 0
      };

      candidate.soundEnabled = Boolean(candidate.soundEnabled);
      candidate.tutorialSeen = Boolean(candidate.tutorialSeen);

      return candidate;
    }

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
        if (!raw) return null;

        const parsed = JSON.parse(raw);
        return isValidSavedState(parsed)
          ? hydrateState(parsed)
          : null;
      } catch (error) {
        return null;
      }
    }

    function saveState() {
      try {
        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        // The game remains playable if local storage is unavailable.
      }
    }

    function restartCurrentScenario() {
      const soundSetting = state.soundEnabled;
      const tutorialSeen = state.tutorialSeen;

      state = createState(state.seed);
      state.soundEnabled = soundSetting;
      state.tutorialSeen = tutorialSeen;

      saveState();
      render();
      showToast("Scenario restarted with the same demand sequence.");
    }

    function startNewScenario(showTutorial = false) {
      const soundSetting = state ? state.soundEnabled : false;

      state = createState(randomSeed());
      state.soundEnabled = soundSetting;
      state.tutorialSeen = !showTutorial;

      saveState();
      render();

      if (showTutorial) {
        showTutorialModal(0);
      } else {
        showToast("A fresh 30-day scenario is ready.");
      }
    }

    /* =========================================================
       INVENTORY CALCULATIONS
       An order made on Day D arrives at the start of Day D + 2.
       ========================================================= */
    function processStartOfDayArrivals() {
      const arriving = state.pipeline.filter(
        order => order.arrivalDay === state.day
      );

      const scheduled = arriving.reduce(
        (sum, order) => sum + order.qty,
        0
      );

      const availableSpace = Math.max(
        0,
        CONFIG.MAX_CAPACITY - state.onHand
      );

      const accepted = Math.min(scheduled, availableSpace);
      const rejected = Math.max(0, scheduled - accepted);

      state.onHand += accepted;
      state.pipeline = state.pipeline.filter(
        order => order.arrivalDay !== state.day
      );
      state.metrics.rejected += rejected;

      state.todayArrival = {
        scheduled,
        accepted,
        rejected
      };
    }

    function canOrderToday() {
      return (
        state.day + CONFIG.DELIVERY_LEAD_TIME <=
        CONFIG.SIMULATION_DAYS
      );
    }

    function outstandingQuantity() {
      return state.pipeline.reduce(
        (sum, order) => sum + order.qty,
        0
      );
    }

    function inventoryPosition() {
      return state.onHand + outstandingQuantity();
    }

    function overflowRiskForOrder(quantity) {
      if (quantity <= 0) return 0;

      const arrivalDay = state.day + CONFIG.DELIVERY_LEAD_TIME;

      const earlierPipeline = state.pipeline
        .filter(order => order.arrivalDay <= arrivalDay)
        .reduce((sum, order) => sum + order.qty, 0);

      // A cautious warning assuming very little is sold beforehand.
      return Math.max(
        0,
        state.onHand +
          earlierPipeline +
          quantity -
          CONFIG.MAX_CAPACITY
      );
    }

    function runDay() {
      if (state.phase !== "decision") return;

      const dayData = state.scenario[state.day - 1];

      const orderQty = canOrderToday()
        ? clamp(
            Math.round(Number(state.orderQty) || 0),
            0,
            CONFIG.MAX_ORDER_QUANTITY
          )
        : 0;

      const arrivalDay =
        state.day + CONFIG.DELIVERY_LEAD_TIME;

      const purchaseCost = roundMoney(
        orderQty * CONFIG.PURCHASE_COST
      );

      const fixedCost =
        orderQty > 0
          ? CONFIG.FIXED_DELIVERY_COST
          : 0;

      if (orderQty > 0) {
        state.pipeline.push({
          qty: orderQty,
          placedDay: state.day,
          arrivalDay
        });

        state.metrics.ordersPlaced++;
      }

      const startingInventory = state.onHand;
      const demand = dayData.demand;
      const sales = Math.min(startingInventory, demand);
      const lostSales = Math.max(0, demand - startingInventory);
      const endingInventory = startingInventory - sales;

      const revenue = roundMoney(
        sales * CONFIG.SELLING_PRICE
      );

      const holdingCost = roundMoney(
        endingInventory * CONFIG.DAILY_HOLDING_COST
      );

      const stockoutPenalty = roundMoney(
        lostSales * CONFIG.STOCKOUT_PENALTY
      );

      const dailyProfit = roundMoney(
        revenue -
        purchaseCost -
        fixedCost -
        holdingCost -
        stockoutPenalty
      );

      state.onHand = endingInventory;

      state.metrics.revenue = roundMoney(
        state.metrics.revenue + revenue
      );

      state.metrics.purchaseCost = roundMoney(
        state.metrics.purchaseCost + purchaseCost
      );

      state.metrics.fixedCost = roundMoney(
        state.metrics.fixedCost + fixedCost
      );

      state.metrics.holdingCost = roundMoney(
        state.metrics.holdingCost + holdingCost
      );

      state.metrics.stockoutPenalty = roundMoney(
        state.metrics.stockoutPenalty + stockoutPenalty
      );

      state.metrics.profit = roundMoney(
        state.metrics.profit + dailyProfit
      );

      state.metrics.sold += sales;
      state.metrics.demand += demand;
      state.metrics.lost += lostSales;
      state.metrics.endingInventorySum += endingInventory;

      if (lostSales > 0) {
        state.metrics.stockoutDays++;
      }

      state.history.push({
        day: state.day,
        weekday: dayData.weekday,
        forecastLow: dayData.forecastLow,
        forecastHigh: dayData.forecastHigh,
        order: orderQty,
        arrivalDay: orderQty > 0 ? arrivalDay : null,
        received: state.todayArrival.accepted,
        rejected: state.todayArrival.rejected,
        startingInventory,
        demand,
        sales,
        lostSales,
        endingInventory,
        revenue,
        purchaseCost,
        fixedCost,
        holdingCost,
        stockoutPenalty,
        dailyProfit
      });

      state.phase = "result";
      state.orderQty = 0;

      saveState();
      playSound(lostSales > 0 ? "stockout" : "success");
      render();

      // Keep the player's current scroll position.
      // The next action remains visible in the sticky menu.
      const menuAction = document.getElementById("menuActionButton");
      if (menuAction) {
        menuAction.focus({ preventScroll: true });
      }
    }

    function advanceDay() {
      if (state.phase !== "result") return;

      if (state.day >= CONFIG.SIMULATION_DAYS) {
        state.phase = "ended";
        saveState();
        playSound("complete");
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      state.day++;
      state.phase = "decision";
      state.orderQty = 0;

      processStartOfDayArrivals();
      saveState();
      render();

      // Intentionally do not scroll. The ordering controls and main
      // action remain available in the sticky menu bar.
    }

    /* =========================================================
       REORDER-POINT BENCHMARK
       Uses the exact same scenario as the player.
       ========================================================= */
    function simulateBenchmark() {
      let onHand = CONFIG.INITIAL_INVENTORY;
      let pipeline = [];
      const metrics = emptyMetrics();
      const history = [];

      for (let day = 1; day <= CONFIG.SIMULATION_DAYS; day++) {
        const dayData = state.scenario[day - 1];

        const arriving = pipeline.filter(
          order => order.arrivalDay === day
        );

        const scheduled = arriving.reduce(
          (sum, order) => sum + order.qty,
          0
        );

        const space = Math.max(
          0,
          CONFIG.MAX_CAPACITY - onHand
        );

        const accepted = Math.min(scheduled, space);
        const rejected = Math.max(0, scheduled - accepted);

        onHand += accepted;
        metrics.rejected += rejected;

        pipeline = pipeline.filter(
          order => order.arrivalDay !== day
        );

        const position =
          onHand +
          pipeline.reduce(
            (sum, order) => sum + order.qty,
            0
          );

        let orderQty = 0;

        if (
          day + CONFIG.DELIVERY_LEAD_TIME <=
            CONFIG.SIMULATION_DAYS &&
          position <= CONFIG.BENCHMARK_REORDER_POINT
        ) {
          orderQty = clamp(
            CONFIG.BENCHMARK_ORDER_UP_TO - position,
            0,
            CONFIG.MAX_ORDER_QUANTITY
          );
        }

        const purchaseCost = roundMoney(
          orderQty * CONFIG.PURCHASE_COST
        );

        const fixedCost =
          orderQty > 0
            ? CONFIG.FIXED_DELIVERY_COST
            : 0;

        if (orderQty > 0) {
          pipeline.push({
            qty: orderQty,
            placedDay: day,
            arrivalDay:
              day + CONFIG.DELIVERY_LEAD_TIME
          });

          metrics.ordersPlaced++;
        }

        const demand = dayData.demand;
        const sales = Math.min(onHand, demand);
        const lostSales = Math.max(0, demand - onHand);

        onHand -= sales;

        const revenue = roundMoney(
          sales * CONFIG.SELLING_PRICE
        );

        const holdingCost = roundMoney(
          onHand * CONFIG.DAILY_HOLDING_COST
        );

        const stockoutPenalty = roundMoney(
          lostSales * CONFIG.STOCKOUT_PENALTY
        );

        const dailyProfit = roundMoney(
          revenue -
          purchaseCost -
          fixedCost -
          holdingCost -
          stockoutPenalty
        );

        metrics.revenue = roundMoney(
          metrics.revenue + revenue
        );

        metrics.purchaseCost = roundMoney(
          metrics.purchaseCost + purchaseCost
        );

        metrics.fixedCost = roundMoney(
          metrics.fixedCost + fixedCost
        );

        metrics.holdingCost = roundMoney(
          metrics.holdingCost + holdingCost
        );

        metrics.stockoutPenalty = roundMoney(
          metrics.stockoutPenalty + stockoutPenalty
        );

        metrics.profit = roundMoney(
          metrics.profit + dailyProfit
        );

        metrics.sold += sales;
        metrics.demand += demand;
        metrics.lost += lostSales;
        metrics.endingInventorySum += onHand;

        if (lostSales > 0) {
          metrics.stockoutDays++;
        }

        history.push({
          day,
          demand,
          order: orderQty,
          endingInventory: onHand,
          lostSales,
          dailyProfit
        });
      }

      return {
        metrics,
        history,
        serviceLevel: serviceLevel(metrics),
        averageInventory:
          metrics.endingInventorySum /
          CONFIG.SIMULATION_DAYS
      };
    }

    /* =========================================================
       SCORE AND FEEDBACK
       ========================================================= */
    function calculateScore(benchmark) {
      const playerService = serviceLevel(state.metrics);

      const averageInventory =
        state.metrics.endingInventorySum /
        CONFIG.SIMULATION_DAYS;

      const servicePoints =
        40 * (playerService / 100);

      const stockoutPoints =
        15 *
        clamp(
          1 - state.metrics.stockoutDays / 10,
          0,
          1
        );

      const overflowPoints =
        10 *
        clamp(
          1 - state.metrics.rejected / 20,
          0,
          1
        );

      const inventoryPoints =
        averageInventory <= 18
          ? 10
          : 10 *
            clamp(
              1 - (averageInventory - 18) / 18,
              0,
              1
            );

      const comparisonScale = Math.max(
        100,
        Math.abs(benchmark.metrics.profit)
      );

      const profitPoints = clamp(
        18 +
          (
            (state.metrics.profit -
              benchmark.metrics.profit) /
            comparisonScale
          ) *
            12,
        0,
        25
      );

      return Math.round(
        clamp(
          servicePoints +
          stockoutPoints +
          overflowPoints +
          inventoryPoints +
          profitPoints,
          0,
          100
        )
      );
    }

    function ratingForScore(score) {
      if (score >= 90) return "Inventory Master";
      if (score >= 75) return "Smart Planner";
      if (score >= 60) return "Rising Restocker";
      return "Try Another Strategy";
    }

    function personalizedResult(averageInventory) {
      const service = serviceLevel(state.metrics);

      if (
        service >= 95 &&
        state.metrics.stockoutDays <= 2 &&
        averageInventory <= 18 &&
        state.metrics.rejected === 0
      ) {
        return "You balanced product availability and inventory cost very effectively.";
      }

      if (service >= 95 && averageInventory > 20) {
        return "Your service level was excellent, but high average stock increased holding costs.";
      }

      if (service < 90 && averageInventory < 10) {
        return "You kept inventory lean, but several stockouts reduced sales, satisfaction, and profit.";
      }

      if (state.metrics.rejected > 0) {
        return "Some deliveries overflowed. Remember that cans already on the way are part of inventory position.";
      }

      if (state.metrics.stockoutDays >= 5) {
        return "A slightly earlier reorder point or more safety stock could protect you during busy days.";
      }

      return "Your plan handled uncertainty reasonably well. Try refining when and how much you reorder.";
    }

    function dailyEncouragement(item) {
      if (item.lostSales > 0) {
        return "Stockout! A slightly earlier order or a little safety stock could help.";
      }

      if (
        item.demand >= 11 &&
        item.endingInventory <= 4
      ) {
        return "Your safety stock saved the day—high demand was fully served.";
      }

      if (item.endingInventory >= 28) {
        return "Customers were served, but holding too much stock reduces profit.";
      }

      if (
        item.demand === item.sales &&
        item.endingInventory >= 3
      ) {
        return "Great planning! Every customer was served and a useful buffer remains.";
      }

      return "Successful day: every customer got a can.";
    }

    /* =========================================================
       STICKY COMMAND BAR
       ========================================================= */

      if (state.phase === "decision") {
        const orderingAllowed = canOrderToday();

        commandBar.innerHTML = `
          <div class="header-order-controls" aria-label="Quick order quantity controls">
            <button
              id="headerMinusButton"
              class="header-order-button"
              type="button"
              aria-label="Decrease order quantity"
              ${orderingAllowed ? "" : "disabled"}
            >−</button>

            <div class="header-order-value" aria-live="polite">
              <strong id="headerOrderValue">${orderingAllowed ? state.orderQty : 0}</strong>
              <span>Order</span>
            </div>

            <button
              id="headerPlusButton"
              class="header-order-button"
              type="button"
              aria-label="Increase order quantity"
              ${orderingAllowed ? "" : "disabled"}
            >+</button>
          </div>

          <button
            id="menuActionButton"
            class="menu-action-button"
            type="button"
            aria-label="${
              orderingAllowed
                ? `Confirm an order of ${state.orderQty} cans and reveal actual demand`
                : "Reveal actual demand with no order"
            }"
          >
            <span class="long-action">
              ${
                orderingAllowed
                  ? `Confirm ${state.orderQty} can${state.orderQty === 1 ? "" : "s"} & reveal demand`
                  : "Reveal demand — ordering closed"
              }
            </span>
            <span class="short-action">
              ${orderingAllowed ? "Reveal demand" : "Run day"}
            </span>
          </button>
        `;

        document
          .getElementById("headerMinusButton")
          .addEventListener("click", () => {
            updateOrderQuantity(state.orderQty - 1);
            playSound("tap");
          });

        document
          .getElementById("headerPlusButton")
          .addEventListener("click", () => {
            updateOrderQuantity(state.orderQty + 1);
            playSound("tap");
          });

        document
          .getElementById("menuActionButton")
          .addEventListener("click", runDay);

        return;
      }

      if (state.phase === "result") {
        const item =
          state.history[state.history.length - 1];

        const nextText =
          state.day === CONFIG.SIMULATION_DAYS
            ? "View final report"
            : `Continue to Day ${state.day + 1}`;

        commandBar.innerHTML = `
          <div class="command-status">
            <strong>
              Day ${state.day}: ${item.sales} sold
              ${item.lostSales > 0 ? ` · ${item.lostSales} lost` : " · all served"}
            </strong>
            <span>
              Profit ${formatCurrency(item.dailyProfit)} ·

            </span>

          <button
            id="menuActionButton"
            class="menu-action-button"
            type="button"
          >
            <span class="long-action">${nextText}</span>
            <span class="short-action">
              ${state.day === CONFIG.SIMULATION_DAYS ? "Final report" : "Next day"}
            </span>
          </button>
        `;

        document
          .getElementById("menuActionButton")
          .addEventListener("click", advanceDay);

        return;
      }

      commandBar.innerHTML = `
        <div class="command-status">
          <strong>30-day challenge complete</strong>
          <span>Your final results are shown below.</span>
        </div>

        <button
          id="menuActionButton"
          class="menu-action-button"
          type="button"
        >
          <span class="long-action">Play a new scenario</span>
          <span class="short-action">New game</span>
        </button>
      `;

      document
        .getElementById("menuActionButton")
        .addEventListener("click", () => {
          showNewScenarioConfirmation();
        });
    }

    /* =========================================================
       GAME MARKUP
       ========================================================= */
    function progressMarkup() {
      let blocks = "";

      for (
        let day = 1;
        day <= CONFIG.SIMULATION_DAYS;
        day++
      ) {
        const completed =
          state.phase === "ended" ||
          day < state.day ||
          (
            day === state.day &&
            state.phase === "result"
          );

        const current =
          state.phase !== "ended" &&
          day === state.day &&
          state.phase === "decision";

        const className = completed
          ? "progress-day done"
          : current
            ? "progress-day current"
            : "progress-day";

        const description = completed
          ? `Day ${day}, complete`
          : current
            ? `Day ${day}, current`
            : `Day ${day}, upcoming`;

        blocks += `
          <span
            class="${className}"
            title="${description}"
          ></span>
        `;
      }

      return blocks;
    }
