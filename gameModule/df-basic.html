<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coffee Bean Demand Forecasting Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; }
  .boot-msg { font-family: system-ui, sans-serif; padding: 2rem; color: #57534e; }
</style>
</head>
<body>
<div id="root"><div class="boot-msg">Loading forecasting lab…</div></div>

<!-- The app source is stored as raw text and compiled manually after all
     dependencies are confirmed loaded. -->
<script type="text/plain" id="app-source">
const { useState, useMemo, useEffect } = React;
const {
  LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
  ResponsiveContainer, ReferenceLine
} = Recharts;

/* ---------- Inline SVG icons (replacing lucide-react) ---------- */
const Svg = ({ children, className }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
    strokeLinejoin="round" className={className}>{children}</svg>
);
const Coffee = ({ className }) => (<Svg className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></Svg>);
const RefreshCw = ({ className }) => (<Svg className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></Svg>);
const ChevronRight = ({ className }) => (<Svg className={className}><path d="m9 18 6-6-6-6"/></Svg>);
const Upload = ({ className }) => (<Svg className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></Svg>);
const Download = ({ className }) => (<Svg className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></Svg>);
const RotateCcw = ({ className }) => (<Svg className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Svg>);
const Play = ({ className }) => (<Svg className={className}><polygon points="6 3 20 12 6 21 6 3"/></Svg>);
const Trophy = ({ className }) => (<Svg className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></Svg>);
const X = ({ className }) => (<Svg className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Svg>);
const Info = ({ className }) => (<Svg className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Svg>);
const Settings = ({ className }) => (<Svg className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Svg>);
const Lock = ({ className }) => (<Svg className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Svg>);

/* ---------- Game constants & helpers ---------- */
const FROZEN = 4;
const HIST = 52;
const HORIZON = 52;
const PASSWORD = 'polyuise';

const DIFFICULTY = { easy: 0.55, medium: 1.0, hard: 1.7 };

const DEFAULT_PARAMS = {
  stationary:    { mean: 50, noiseStd: 11 },
  trend:         { base: 15, slope: 0.5, noiseStd: 8 },
  seasonal:      { base: 25, slope: 0.25, amplitude: 18, period: 52, noiseStd: 6 },
  promo:         { base: 20, slope: 0.35, noiseStd: 6, promoProb: 0.07, promoMin: 28, promoRange: 15 },
  nonstationary: { rangeScale: 0.85, offset: 7, noiseStd: 8 },
};

const SCENARIOS = {
  stationary:    { label: '1 · Stationary Stochastic',           desc: 'Demand fluctuates randomly around a constant mean. No trend, no seasonality.' },
  trend:         { label: '2 · Stochastic Increasing Trend',     desc: 'A steadily rising trend line with random noise.' },
  seasonal:      { label: '3 · Trend + Seasonality',             desc: 'An increasing trend combined with a repeating seasonal wave.' },
  promo:         { label: '4 · Trend + Random Promotion Spikes', desc: 'An increasing trend with occasional unpredictable demand spikes (promotions).' },
  nonstationary: { label: '5 · Non-Stationary / Uniform',        desc: 'Highly erratic demand near-uniformly across the 0–100 range. Very hard to forecast.' },
};

const PARAM_FIELDS = {
  stationary:    [['mean', 'Mean level', 1], ['noiseStd', 'Noise std', 0.5]],
  trend:         [['base', 'Base level', 1], ['slope', 'Slope per week', 0.05], ['noiseStd', 'Noise std', 0.5]],
  seasonal:      [['base', 'Base level', 1], ['slope', 'Slope per week', 0.05], ['amplitude', 'Seasonal amplitude', 1], ['period', 'Season period (wks)', 1], ['noiseStd', 'Noise std', 0.5]],
  promo:         [['base', 'Base level', 1], ['slope', 'Slope per week', 0.05], ['noiseStd', 'Noise std', 0.5], ['promoProb', 'Promo probability', 0.01], ['promoMin', 'Promo min bonus', 1], ['promoRange', 'Promo bonus range', 1]],
  nonstationary: [['rangeScale', 'Range scale (0-1)', 0.05], ['offset', 'Offset', 1], ['noiseStd', 'Noise std', 0.5]],
};

function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const clamp = (v) => Math.max(0, Math.min(100, Math.round(v)));

function generateFull(scenario, diff, params) {
  const noise = DIFFICULTY[diff];
  const p = params[scenario];
  const N = HIST + HORIZON + 1;
  const arr = [];
  for (let t = 0; t < N; t++) {
    let v;
    switch (scenario) {
      case 'stationary':
        v = p.mean + gauss() * p.noiseStd * noise;
        break;
      case 'trend':
        v = p.base + p.slope * t + gauss() * p.noiseStd * noise;
        break;
      case 'seasonal':
        v = p.base + p.slope * t + p.amplitude * Math.sin((2 * Math.PI * t) / p.period) + gauss() * p.noiseStd * noise;
        break;
      case 'promo':
        v = p.base + p.slope * t + gauss() * p.noiseStd * noise;
        if (Math.random() < p.promoProb) v += p.promoMin + Math.random() * p.promoRange;
        break;
      case 'nonstationary':
      default:
        v = Math.random() * 100 * p.rangeScale + gauss() * p.noiseStd * noise + p.offset;
        break;
    }
    arr.push(clamp(v));
  }
  return { historical: arr.slice(0, HIST), actualSeries: arr.slice(HIST, N) };
}

function DemandForecastGame() {
  const [scenario, setScenario] = useState('stationary');
  const [difficulty, setDifficulty] = useState('easy');
  const [params, setParams] = useState(DEFAULT_PARAMS);
  const [gameId, setGameId] = useState(1);

  const [currentWeek, setCurrentWeek] = useState(0);
  const [forecasts, setForecasts] = useState({});
  const [userSet, setUserSet] = useState({});
  const [recorded, setRecorded] = useState({});

  const [modal, setModal] = useState(null);
  const [importText, setImportText] = useState('');

  const [settingsOpen, setSettingsOpen] = useState(false);
  const [unlocked, setUnlocked] = useState(false);
  const [pwInput, setPwInput] = useState('');
  const [pwError, setPwError] = useState('');
  const [draftParams, setDraftParams] = useState(DEFAULT_PARAMS);
  const [draftDifficulty, setDraftDifficulty] = useState('easy');

  const { historical, actualSeries } = useMemo(
    () => generateFull(scenario, difficulty, params),
    [scenario, difficulty, params, gameId]
  );

  useEffect(() => {
    setCurrentWeek(0); setForecasts({}); setUserSet({}); setRecorded({});
  }, [scenario, difficulty, params, gameId]);

  const actualAt = (week) => {
    if (week < 0) return historical[week + HIST];
    if (week >= 0 && week <= currentWeek) return actualSeries[week];
    return null;
  };

  const movingAvg = (atWeek) => {
    let sum = 0, c = 0;
    for (let k = atWeek - 3; k <= atWeek; k++) {
      const a = k < 0 ? historical[k + HIST] : (k <= atWeek ? actualSeries[k] : null);
      if (a != null) { sum += a; c++; }
    }
    return c ? sum / c : 50;
  };

  const getForecast = (w, atWeek = currentWeek) => userSet[w] ? forecasts[w] : movingAvg(atWeek);
  const isEditable = (w) => w >= currentWeek + FROZEN + 1 && w <= HORIZON;
  const isFrozen = (w) => w >= currentWeek + 1 && w <= currentWeek + FROZEN;

  const advance = (steps = 1) => {
    let t = currentWeek;
    const newRec = { ...recorded };
    for (let s = 0; s < steps && t < HORIZON; s++) {
      const w = t + 1;
      newRec[w] = userSet[w] ? forecasts[w] : movingAvg(t);
      t = w;
    }
    setRecorded(newRec); setCurrentWeek(t);
  };

  const metrics = useMemo(() => {
    let n = 0, sumAbs = 0, sumPct = 0, nPct = 0, sumSq = 0;
    for (let w = 5; w <= currentWeek; w++) {
      const a = actualSeries[w]; const f = recorded[w];
      if (f == null) continue;
      const e = a - f;
      sumAbs += Math.abs(e); sumSq += e * e; n++;
      if (a !== 0) { sumPct += Math.abs(e) / a; nPct++; }
    }
    return { n, mae: n ? sumAbs / n : null, rmse: n ? Math.sqrt(sumSq / n) : null, mape: nPct ? (sumPct / nPct) * 100 : null };
  }, [currentWeek, recorded, actualSeries]);

  const chartData = useMemo(() => {
    const data = [];
    for (let week = -HIST; week <= HORIZON; week++) {
      const entry = { week };
      entry.actual = week <= currentWeek ? actualAt(week) : null;
      entry.committed = week >= 1 && week <= currentWeek ? (recorded[week] ?? null) : null;
      if (week === currentWeek) entry.forecast = actualAt(week);
      else if (week > currentWeek && week >= 1) entry.forecast = Math.round(getForecast(week));
      else entry.forecast = null;
      data.push(entry);
    }
    return data;
  }, [currentWeek, forecasts, userSet, recorded, historical, actualSeries]);

  const setForecastValue = (w, raw) => {
    if (raw === '') {
      const nf = { ...forecasts }; const ns = { ...userSet };
      delete nf[w]; delete ns[w]; setForecasts(nf); setUserSet(ns);
    } else {
      const v = Math.max(0, parseFloat(raw));
      if (isNaN(v)) return;
      setForecasts({ ...forecasts, [w]: v }); setUserSet({ ...userSet, [w]: true });
    }
  };

  const resetFutureForecasts = () => {
    const nf = { ...forecasts }; const ns = { ...userSet };
    for (let w = currentWeek + FROZEN + 1; w <= HORIZON; w++) { delete nf[w]; delete ns[w]; }
    setForecasts(nf); setUserSet(ns);
  };

  const doImport = () => {
    const lines = importText.trim().split(/\n+/);
    const nf = { ...forecasts }; const ns = { ...userSet };
    let seq = currentWeek + FROZEN + 1;
    lines.forEach((line) => {
      const nums = line.split(/[,;\t ]+/).map((s) => parseFloat(s)).filter((n) => !isNaN(n));
      if (nums.length >= 2) {
        const w = Math.round(nums[0]); const v = Math.max(0, nums[1]);
        if (w >= currentWeek + FROZEN + 1 && w <= HORIZON) { nf[w] = v; ns[w] = true; }
      } else if (nums.length === 1) {
        if (seq <= HORIZON) { nf[seq] = Math.max(0, nums[0]); ns[seq] = true; seq++; }
      }
    });
    setForecasts(nf); setUserSet(ns); setModal(null); setImportText('');
  };

  const exportText = useMemo(() => {
    let s = 'week,demand\n';
    for (let w = -HIST; w <= currentWeek; w++) s += `${w},${actualAt(w)}\n`;
    return s;
  }, [currentWeek, historical, actualSeries]);

  const openSettings = () => {
    setSettingsOpen(true);
    if (!unlocked) { setPwInput(''); setPwError(''); }
    setDraftParams(JSON.parse(JSON.stringify(params)));
    setDraftDifficulty(difficulty);
  };

  const tryUnlock = () => {
    if (pwInput === PASSWORD) { setUnlocked(true); setPwError(''); }
    else setPwError('Incorrect password.');
  };

  const updateDraft = (sc, key, val) => {
    const v = parseFloat(val);
    setDraftParams((prev) => ({ ...prev, [sc]: { ...prev[sc], [key]: isNaN(v) ? 0 : v } }));
  };

  const applySettings = () => {
    setParams(draftParams);
    setDifficulty(draftDifficulty);
    setGameId((g) => g + 1);
    setSettingsOpen(false);
  };

  const restoreDefaults = () => { setDraftParams(JSON.parse(JSON.stringify(DEFAULT_PARAMS))); setDraftDifficulty('easy'); };

  const done = currentWeek >= HORIZON;
  const futureWeeks = []; for (let w = currentWeek + 1; w <= HORIZON; w++) futureWeeks.push(w);
  const pastWeeks = []; for (let w = currentWeek; w >= 1; w--) pastWeeks.push(w);
  const fmt = (v) => (v == null ? '--' : v.toFixed(2));

  return (
    <div className="min-h-screen bg-gradient-to-br from-amber-50 to-orange-50 p-4 text-stone-800">
      <div className="max-w-6xl mx-auto">
        <div className="bg-gradient-to-r from-amber-800 to-orange-700 text-white rounded-2xl p-5 shadow-lg mb-4 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <Coffee className="w-8 h-8 shrink-0" />
            <div className="min-w-0">
              <h1 className="text-xl sm:text-2xl font-bold truncate">Coffee Bean Demand Forecasting Lab</h1>
              <p className="text-amber-100 text-xs sm:text-sm">
                Week {currentWeek} / {HORIZON} · Frozen fence {FROZEN} weeks · Rolling 52-week horizon
              </p>
            </div>
          </div>
          <button onClick={openSettings} title="Settings"
            className="bg-white/15 hover:bg-white/25 p-2 rounded-lg transition shrink-0">
            <Settings className="w-6 h-6" />
          </button>
        </div>

        <div className="bg-white rounded-2xl p-4 shadow mb-4">
          <label className="text-xs font-semibold text-stone-500 uppercase">Demand Scenario</label>
          <select value={scenario} onChange={(e) => setScenario(e.target.value)}
            className="w-full mt-1 border border-stone-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
            {Object.entries(SCENARIOS).map(([k, v]) => (<option key={k} value={k}>{v.label}</option>))}
          </select>
          <div className="mt-3 flex items-start gap-2 bg-amber-50 rounded-lg p-3 text-sm text-stone-600">
            <Info className="w-4 h-4 mt-0.5 text-amber-600 shrink-0" />
            <span>{SCENARIOS[scenario].desc} <span className="font-semibold capitalize">Difficulty: {difficulty}.</span> Parameters are configured in Settings.</span>
          </div>
        </div>

        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          {[
            { label: 'MAE', hint: 'lower is better', val: fmt(metrics.mae), color: 'text-blue-600' },
            { label: 'MAPE', hint: 'lower is better', val: metrics.mape == null ? '--' : metrics.mape.toFixed(1) + '%', color: 'text-purple-600' },
            { label: 'RMSE', hint: 'lower is better', val: fmt(metrics.rmse), color: 'text-rose-600' },
            { label: 'Graded Weeks', hint: 'from week 5', val: `${metrics.n}`, color: 'text-emerald-600' },
          ].map((m) => (
            <div key={m.label} className="bg-white rounded-xl p-4 shadow text-center">
              <div className="text-xs text-stone-400 uppercase font-semibold">{m.label}</div>
              <div className={`text-2xl font-bold ${m.color}`}>{m.val}</div>
              <div className="text-[10px] text-stone-400">{m.hint}</div>
            </div>
          ))}
        </div>

        <div className="bg-white rounded-2xl p-4 shadow mb-4">
          <h2 className="font-semibold mb-2 text-stone-700">📊 Historical & Rolling Forecast</h2>
          <ResponsiveContainer width="100%" height={320}>
            <LineChart data={chartData} margin={{ top: 5, right: 10, left: -10, bottom: 5 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#eee" />
              <XAxis dataKey="week" type="number" domain={[-HIST, HORIZON]}
                ticks={[-52, -39, -26, -13, 0, 13, 26, 39, 52]} tick={{ fontSize: 11 }} />
              <YAxis domain={[0, 100]} tick={{ fontSize: 11 }} />
              <Tooltip formatter={(v) => (v == null ? '-' : Math.round(v))} labelFormatter={(l) => `Week ${l}`} />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              <ReferenceLine x={0} stroke="#a8a29e" strokeDasharray="4 4" label={{ value: 'Year start', fontSize: 10, position: 'top' }} />
              <ReferenceLine x={currentWeek} stroke="#d97706" strokeWidth={2} label={{ value: 'Now', fontSize: 10, position: 'top', fill: '#d97706' }} />
              <ReferenceLine x={currentWeek + FROZEN} stroke="#3b82f6" strokeDasharray="3 3" label={{ value: 'Frozen', fontSize: 10, position: 'top', fill: '#3b82f6' }} />
              <Line type="monotone" dataKey="actual" name="Actual demand" stroke="#78350f" strokeWidth={2} dot={false} connectNulls />
              <Line type="monotone" dataKey="committed" name="Committed forecast" stroke="#10b981" strokeWidth={1.5} strokeDasharray="2 2" dot={false} connectNulls />
              <Line type="monotone" dataKey="forecast" name="Planned forecast" stroke="#2563eb" strokeWidth={2} strokeDasharray="6 4" dot={false} connectNulls />
            </LineChart>
          </ResponsiveContainer>
        </div>

        <div className="flex flex-wrap gap-2 mb-4">
          <button onClick={() => advance(1)} disabled={done}
            className="flex items-center gap-1 bg-amber-600 hover:bg-amber-700 disabled:opacity-40 text-white px-4 py-2 rounded-lg font-semibold text-sm">
            <ChevronRight className="w-4 h-4" /> OK — Advance 1 Week
          </button>
          <button onClick={() => advance(5)} disabled={done}
            className="flex items-center gap-1 bg-orange-500 hover:bg-orange-600 disabled:opacity-40 text-white px-4 py-2 rounded-lg font-semibold text-sm">
            <Play className="w-4 h-4" /> Simulate 5 Weeks
          </button>
          <button onClick={() => setModal('import')}
            className="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold text-sm">
            <Upload className="w-4 h-4" /> Import Forecasts
          </button>
          <button onClick={() => setModal('export')}
            className="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-semibold text-sm">
            <Download className="w-4 h-4" /> Export Data
          </button>
          <button onClick={resetFutureForecasts}
            className="flex items-center gap-1 bg-stone-500 hover:bg-stone-600 text-white px-4 py-2 rounded-lg font-semibold text-sm">
            <RotateCcw className="w-4 h-4" /> Reset Future
          </button>
          <button onClick={() => setGameId((g) => g + 1)}
            className="flex items-center gap-1 bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg font-semibold text-sm">
            <RefreshCw className="w-4 h-4" /> New Game
          </button>
        </div>

        {done && (
          <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl p-5 shadow mb-4 flex items-center gap-3">
            <Trophy className="w-8 h-8" />
            <div>
              <div className="font-bold text-lg">Season Complete! 🎉</div>
              <div className="text-sm">Final MAE {fmt(metrics.mae)} · MAPE {metrics.mape?.toFixed(1)}% · RMSE {fmt(metrics.rmse)} over {metrics.n} weeks.</div>
            </div>
          </div>
        )}

        <div className="grid lg:grid-cols-2 gap-4">
          <div className="bg-white rounded-2xl p-4 shadow">
            <h2 className="font-semibold mb-2 text-stone-700">📋 Forecast Entry (weeks {currentWeek + 1}–{HORIZON})</h2>
            <p className="text-xs text-stone-400 mb-2">Blue = frozen (locked). White = open. Placeholder shows the moving-average default.</p>
            <div className="overflow-y-auto max-h-96 border border-stone-100 rounded-lg">
              <table className="w-full text-sm">
                <thead className="bg-stone-100 sticky top-0">
                  <tr className="text-stone-500 text-xs">
                    <th className="p-2 text-left">Week</th><th className="p-2 text-left">Status</th><th className="p-2 text-left">Forecast</th>
                  </tr>
                </thead>
                <tbody>
                  {futureWeeks.map((w) => {
                    const editable = isEditable(w); const frozen = isFrozen(w); const ma = Math.round(movingAvg(currentWeek));
                    return (
                      <tr key={w} className={frozen ? 'bg-blue-50' : ''}>
                        <td className="p-2 font-medium">{w}</td>
                        <td className="p-2">{frozen ? <span className="text-blue-600 text-xs font-semibold">🔒 Frozen</span> : <span className="text-emerald-600 text-xs font-semibold">✎ Open</span>}</td>
                        <td className="p-2">
                          {editable ? (
                            <input type="number" min="0" value={userSet[w] ? forecasts[w] : ''} placeholder={ma}
                              onChange={(e) => setForecastValue(w, e.target.value)}
                              className="w-20 border border-stone-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-amber-500 outline-none" />
                          ) : (<span className="font-mono text-stone-600">{Math.round(getForecast(w))}</span>)}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <div className="bg-white rounded-2xl p-4 shadow">
            <h2 className="font-semibold mb-2 text-stone-700">📈 Realized Record</h2>
            <p className="text-xs text-stone-400 mb-2">Errors are graded from Week 5 onward.</p>
            <div className="overflow-y-auto max-h-96 border border-stone-100 rounded-lg">
              <table className="w-full text-sm">
                <thead className="bg-stone-100 sticky top-0">
                  <tr className="text-stone-500 text-xs">
                    <th className="p-2 text-left">Week</th><th className="p-2 text-right">Actual</th><th className="p-2 text-right">Forecast</th><th className="p-2 text-right">|Error|</th><th className="p-2 text-right">% Err</th>
                  </tr>
                </thead>
                <tbody>
                  {pastWeeks.length === 0 && (<tr><td colSpan={5} className="p-4 text-center text-stone-400">Press "OK" to reveal actual demand.</td></tr>)}
                  {pastWeeks.map((w) => {
                    const a = actualSeries[w]; const f = recorded[w];
                    const graded = w >= 5 && f != null;
                    const ae = graded ? Math.abs(a - f) : null;
                    const pe = graded && a !== 0 ? (Math.abs(a - f) / a) * 100 : null;
                    return (
                      <tr key={w} className={w < 5 ? 'text-stone-400' : ''}>
                        <td className="p-2 font-medium">{w}</td>
                        <td className="p-2 text-right font-mono">{a}</td>
                        <td className="p-2 text-right font-mono">{f != null ? Math.round(f) : '-'}</td>
                        <td className="p-2 text-right font-mono">{ae == null ? (w < 5 ? 'warmup' : '-') : ae.toFixed(1)}</td>
                        <td className="p-2 text-right font-mono">{pe == null ? '-' : pe.toFixed(1) + '%'}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <p className="text-center text-xs text-stone-400 mt-4">
          Build your forecasting model outside the game, then paste your numbers via "Import Forecasts". Export the revealed history for analysis.
        </p>
      </div>

      {modal && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-white rounded-2xl p-5 shadow-xl w-full max-w-lg my-auto">
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-bold text-lg">{modal === 'import' ? 'Import Forecasts' : 'Export Data'}</h3>
              <button onClick={() => setModal(null)}><X className="w-5 h-5 text-stone-400" /></button>
            </div>
            {modal === 'import' ? (
              <>
                <p className="text-sm text-stone-500 mb-2">
                  Paste one value per line for consecutive open weeks (from week {currentWeek + FROZEN + 1}),
                  or use <code className="bg-stone-100 px-1 rounded">week,value</code> per line.
                </p>
                <textarea value={importText} onChange={(e) => setImportText(e.target.value)} rows={8}
                  placeholder={`e.g.\n${currentWeek + FROZEN + 1},52\n${currentWeek + FROZEN + 2},55\n...`}
                  className="w-full border border-stone-300 rounded-lg p-2 text-sm font-mono focus:ring-2 focus:ring-amber-500 outline-none" />
                <button onClick={doImport} className="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold">Apply Forecasts</button>
              </>
            ) : (
              <>
                <p className="text-sm text-stone-500 mb-2">Copy this CSV of all revealed demand (weeks -52 to {currentWeek}):</p>
                <textarea readOnly value={exportText} rows={10} className="w-full border border-stone-300 rounded-lg p-2 text-sm font-mono bg-stone-50" />
              </>
            )}
          </div>
        </div>
      )}

      {settingsOpen && (
        <div className="fixed inset-0 bg-black/50 flex items-stretch sm:items-center justify-center p-0 sm:p-4 z-50">
          <div className="bg-white sm:rounded-2xl shadow-xl w-full max-w-2xl flex flex-col max-h-full sm:max-h-full h-full sm:h-auto">
            <div className="flex justify-between items-center p-4 sm:p-5 border-b border-stone-100 shrink-0">
              <h3 className="font-bold text-base sm:text-lg flex items-center gap-2"><Settings className="w-5 h-5" /> Scenario Settings</h3>
              <button onClick={() => setSettingsOpen(false)}><X className="w-5 h-5 text-stone-400" /></button>
            </div>

            {!unlocked ? (
              <div className="p-6 sm:p-8 flex flex-col items-center gap-4 overflow-y-auto">
                <div className="bg-amber-100 p-4 rounded-full"><Lock className="w-8 h-8 text-amber-700" /></div>
                <p className="text-sm text-stone-500 text-center">This page is password-protected. Enter the instructor password to edit scenario parameters and difficulty.</p>
                <input type="password" value={pwInput}
                  onChange={(e) => setPwInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && tryUnlock()}
                  placeholder="Password"
                  className="w-full max-w-xs border border-stone-300 rounded-lg p-2 text-sm text-center focus:ring-2 focus:ring-amber-500 outline-none" />
                {pwError && <p className="text-rose-500 text-sm">{pwError}</p>}
                <button onClick={tryUnlock} className="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-lg font-semibold">Unlock</button>
              </div>
            ) : (
              <>
                <div className="p-4 sm:p-5 overflow-y-auto flex-1 min-h-0">
                  <div className="mb-5">
                    <label className="text-xs font-semibold text-stone-500 uppercase">Difficulty (noise multiplier)</label>
                    <div className="flex flex-wrap gap-2 mt-1">
                      {Object.keys(DIFFICULTY).map((d) => (
                        <button key={d} onClick={() => setDraftDifficulty(d)}
                          className={`flex-1 min-w-max py-2 px-2 rounded-lg text-sm font-medium capitalize transition ${draftDifficulty === d ? 'bg-amber-600 text-white' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}>
                          {d} ×{DIFFICULTY[d]}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-4">
                    {Object.entries(PARAM_FIELDS).map(([sc, fields]) => (
                      <div key={sc} className="border border-stone-200 rounded-xl p-3">
                        <div className="font-semibold text-sm text-stone-700 mb-2">{SCENARIOS[sc].label}</div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                          {fields.map(([key, lbl, step]) => (
                            <div key={key}>
                              <label className="text-xs text-stone-500 block mb-0.5">{lbl}</label>
                              <input type="number" step={step} value={draftParams[sc][key]}
                                onChange={(e) => updateDraft(sc, key, e.target.value)}
                                className="w-full border border-stone-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-amber-500 outline-none" />
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="p-4 sm:p-5 border-t border-stone-100 flex flex-col sm:flex-row gap-2 sm:justify-between shrink-0">
                  <button onClick={restoreDefaults} className="bg-stone-200 hover:bg-stone-300 text-stone-700 px-4 py-2 rounded-lg font-semibold text-sm order-last sm:order-first">Restore Defaults</button>
                  <div className="flex gap-2">
                    <button onClick={() => setSettingsOpen(false)} className="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-600 px-4 py-2 rounded-lg font-semibold text-sm">Cancel</button>
                    <button onClick={applySettings} className="flex-1 bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-lg font-semibold text-sm">Apply & Restart</button>
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DemandForecastGame />);
</script>

<!-- Controlled loader: fetches each dependency in order, verifies globals,
     then compiles and runs the app. -->
<script>
(function () {
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }

  function fail(msg) {
    document.getElementById('root').innerHTML =
      '<div class="boot-msg" style="color:#b91c1c">' +
      'Could not start the app: ' + msg +
      '<br><br>Check your internet connection and that the CDN domains ' +
      '(cdn.jsdelivr.net) are reachable, then reload.</div>';
  }

  var deps = [
    'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
    'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
    'https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js',
    'https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js',
    'https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js'
  ];

  var chain = Promise.resolve();
  deps.forEach(function (src) {
    chain = chain.then(function () { return loadScript(src); });
  });

  chain
    .then(function () {
      if (typeof React === 'undefined')    throw new Error('React did not load.');
      if (typeof ReactDOM === 'undefined')  throw new Error('ReactDOM did not load.');
      if (typeof Recharts === 'undefined')  throw new Error('Recharts did not load.');
      if (typeof Babel === 'undefined')     throw new Error('Babel did not load.');

      var source = document.getElementById('app-source').textContent;
      var compiled = Babel.transform(source, { presets: ['react'] }).code;
      // Run the compiled component code.
      (0, eval)(compiled);
    })
    .catch(function (err) {
      fail(err.message);
    });
})();
</script>
</body>
</html>
