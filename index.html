<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCM Game Hub — Library</title>
  <meta
    name="description"
    content="Browse and launch SCM serious games."
  />
  <link rel="icon" href="pic/icon.png" type="image/png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #05070d;
      --bg-1: #0a0f1c;
      --bg-2: #111a2e;
      --surface: rgba(20, 30, 52, 0.72);
      --surface-solid: #121a30;
      --surface-hover: #1a2540;
      --border: rgba(96, 165, 250, 0.15);
      --border-strong: rgba(96, 165, 250, 0.32);
      --text: #e8eefc;
      --text-dim: #8a99b8;
      --text-mute: #586480;
      --primary: #38bdf8;
      --primary-strong: #0ea5e9;
      --accent: #22d3ee;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #fb7185;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --sidebar-w: 272px;
      --header-h: 68px;
    }

    [data-theme="light"] {
      --bg-0: #eef2fb;
      --bg-1: #f7f9fe;
      --bg-2: #ffffff;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-solid: #ffffff;
      --surface-hover: #f0f4ff;
      --border: rgba(37, 99, 235, 0.14);
      --border-strong: rgba(37, 99, 235, 0.3);
      --text: #0b1220;
      --text-dim: #46526b;
      --text-mute: #7c87a0;
      --primary: #0ea5e9;
      --primary-strong: #0284c7;
      --accent: #06b6d4;
      --accent-glow: rgba(14, 165, 233, 0.22);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Manrope', 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg-0);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 800px 500px at 10% -10%, rgba(56, 189, 248, 0.18), transparent 60%),
        radial-gradient(ellipse 600px 450px at 100% 10%, rgba(34, 211, 238, 0.13), transparent 55%),
        radial-gradient(ellipse 900px 600px at 50% 110%, rgba(99, 102, 241, 0.1), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }

    /* ───────── SIDEBAR BACKDROP (mobile) ───────── */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 49;
    }

    /* ───────── SIDEBAR ───────── */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      grid-column: 1;
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(12, 20, 38, 0.88), rgba(8, 14, 28, 0.94));
      backdrop-filter: blur(20px) saturate(140%);
      padding: 22px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
      z-index: 10;
    }

    [data-theme="light"] .sidebar {
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(244,247,254,0.95));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--primary), #6366f1 70%, var(--accent));
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .brand-mark img { width: 28px; height: 28px; object-fit: contain; }

    .brand-text { min-width: 0; }
    .brand-label {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-mute);
    }
    .brand-title {
      display: block;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }

    .side-section-label {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-mute);
      padding: 14px 12px 8px;
    }

    .cat-list {
      list-style: none;
      margin: 0;
      padding: 0 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
    }

    .cat-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border);
    }

    .cat-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(99, 102, 241, 0.12));
      color: var(--text);
      border-color: var(--border-strong);
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.08), 0 4px 14px var(--accent-glow);
    }

    .cat-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .cat-btn.active .cat-icon { transform: scale(1.08); }

    .cat-icon svg { width: 17px; height: 17px; }

    .cat-info { min-width: 0; flex: 1; }
    .cat-name {
      font-weight: 600;
      font-size: 0.92rem;
      line-height: 1.2;
    }
    .cat-count {
      font-size: 0.72rem;
      color: var(--text-mute);
      margin-top: 3px;
      font-weight: 500;
    }

    .cat-btn.active .cat-count { color: var(--primary); }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .stat-num {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--primary);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--text-mute);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ───────── MAIN AREA ───────── */
    .main-area {
      min-width: 0;
      grid-column: 2;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 9;
      height: var(--header-h);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(8, 14, 28, 0.92) 0%, rgba(8, 14, 28, 0.78) 100%);
      backdrop-filter: blur(22px) saturate(160%);
    }

    [data-theme="light"] .top-bar {
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.88));
    }

    .search-wrap {
      flex: 1;
      max-width: 560px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      color: var(--text-mute);
    }
    .search-wrap input {
      width: 100%;
      height: 46px;
      padding: 0 16px 0 44px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all 0.2s ease;
    }
    .search-wrap input::placeholder { color: var(--text-mute); }
    .search-wrap input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--accent-glow);
      background: var(--surface-solid);
    }

    .top-filters {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chip-select {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.18s ease;
      font-weight: 500;
      font-size: 0.86rem;
    }
    .chip-select:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      color: var(--text);
    }
    .chip-select select {
      background: transparent;
      border: none;
      outline: none;
      color: inherit;
      padding: 0;
      cursor: pointer;
    }
    .chip-select select option { background: var(--bg-1); color: var(--text); }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.18s ease;
    }
    .icon-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-strong);
    }
    .icon-btn svg { width: 18px; height: 18px; }

    /* ───────── CONTENT ───────── */
    .content {
      padding: 28px 32px 56px;
      flex: 1;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .page-title {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 2.4vw, 2.1rem);
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.1;
    }
    .page-sub {
      color: var(--text-dim);
      margin: 6px 0 0;
      font-size: 0.94rem;
    }
    .results-meta {
      color: var(--text-mute);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      white-space: nowrap;
    }

    /* ───────── FEATURED BANNER ───────── */
    .featured {
      position: relative;
      margin-bottom: 36px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      min-height: 290px;
      border: 1px solid var(--border-strong);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
      cursor: pointer;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      display: block;
    }
    .featured:hover {
      transform: translateY(-3px);
      box-shadow: 0 40px 90px rgba(56, 189, 248, 0.12), 0 32px 70px rgba(0,0,0,0.5);
    }
    .featured-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }
    .featured-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(100deg, rgba(5,7,13,0.96) 0%, rgba(5,7,13,0.78) 42%, rgba(5,7,13,0.28) 75%, transparent 100%),
        linear-gradient(0deg, rgba(5,7,13,0.6) 0%, transparent 50%);
    }
    [data-theme="light"] .featured-overlay {
      background:
        linear-gradient(100deg, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.82) 42%, rgba(255,255,255,0.35) 75%, transparent 100%),
        linear-gradient(0deg, rgba(255,255,255,0.5) 0%, transparent 50%);
    }
    .featured-inner {
      position: relative;
      padding: 42px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 290px;
      max-width: 62%;
    }
    .featured-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      align-self: flex-start;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: #fff;
      margin-bottom: 18px;
      box-shadow: 0 8px 22px rgba(56, 189, 248, 0.35);
    }
    .featured-title {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0 0 10px;
    }
    .featured-desc {
      color: var(--text-dim);
      font-size: 0.98rem;
      margin: 0 0 22px;
      max-width: 50ch;
    }
    .featured-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-dim);
    }
    .meta-pill svg { width: 13px; height: 13px; }
    .featured-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-solid);
      color: var(--text);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #021018;
      border: none;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.35);
    }
    .btn.primary:hover {
      box-shadow: 0 14px 40px rgba(56, 189, 248, 0.48);
      transform: translateY(-2px);
    }
    .btn.ghost {
      background: transparent;
      border-color: var(--border-strong);
      color: var(--text);
    }
    .btn svg { width: 15px; height: 15px; }

    /* ───────── CATEGORY ROWS ───────── */
    .category-section {
      margin-bottom: 40px;
    }
    .category-section:last-child { margin-bottom: 0; }

    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
      padding: 0 2px;
    }
    .cat-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .cat-header-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }
    .cat-header-icon svg { width: 20px; height: 20px; }
    .cat-header-text h3 {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .cat-header-text p {
      margin: 3px 0 0;
      font-size: 0.84rem;
      color: var(--text-mute);
      max-width: 52ch;
    }
    .cat-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .row-wrap { position: relative; }

    .scroll-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: clamp(230px, 22vw, 280px);
      gap: 18px;
      overflow-x: auto;
      padding: 8px 4px 18px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: rgba(96,165,250,0.35) transparent;
    }
    .scroll-row::-webkit-scrollbar { height: 8px; }
    .scroll-row::-webkit-scrollbar-track { background: transparent; }
    .scroll-row::-webkit-scrollbar-thumb {
      background: rgba(96,165,250,0.25);
      border-radius: 999px;
    }
    .scroll-row::-webkit-scrollbar-thumb:hover { background: rgba(96,165,250,0.45); }

    /* ───────── GAME CARD ───────── */
    .game-card {
      scroll-snap-align: start;
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      transition: transform 0.28s cubic-bezier(.2,.8,.2,1), box-shadow 0.28s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .card-click-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: pointer;
    }
    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--border-strong);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px var(--accent-glow);
      z-index: 3;
    }

    .cover {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: var(--bg-2);
    }
    .cover-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
    }
    .game-card:hover .cover-img { transform: scale(1.08); }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 40%, rgba(5,7,13,0.92) 100%),
        linear-gradient(0deg, transparent 0%, rgba(5,7,13,0.1) 40%);
    }

    [data-theme="light"] .cover-overlay {
      background:
        linear-gradient(180deg, transparent 40%, rgba(5,7,13,0.78) 100%),
        linear-gradient(0deg, transparent 0%, rgba(255,255,255,0.05) 40%);
    }

    .cover-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      z-index: 2;
    }
    .new-badge {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, #fb7185, #f43f5e);
      color: #fff;
      box-shadow: 0 6px 14px rgba(244, 63, 94, 0.4);
    }
    .quick-play {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.92);
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #021018;
      opacity: 0;
      transform: translateY(-6px) scale(0.85);
      transition: all 0.26s cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 8px 22px rgba(56, 189, 248, 0.45);
      position: relative;
      z-index: 2;
    }
    .game-card:hover .quick-play {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .quick-play:hover {
      transform: scale(1.1) !important;
      background: var(--accent);
    }
    .quick-play svg { width: 15px; height: 15px; margin-left: 2px; }

    .cover-title {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      z-index: 2;
    }
    .cover-title h4 {
      margin: 0;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.03rem;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }
    [data-theme="light"] .cover-title h4 {
      color: #fff;
    }

    .card-body {
      padding: 14px 15px 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .card-tag {
      font-size: 0.66rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(96, 165, 250, 0.1);
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .card-tag.time {
      background: rgba(138, 153, 184, 0.12);
      color: var(--text-dim);
    }

    .desc-wrap {
      position: relative;
    }
    .desc-text {
      margin: 0;
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .desc-wrap.expanded .desc-text {
      -webkit-line-clamp: unset;
      display: block;
    }
    .desc-toggle {
      margin-top: 6px;
      background: none;
      border: none;
      padding: 0;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      position: relative;
      z-index: 2;
    }
    .desc-toggle:hover { text-decoration: underline; }
    .desc-toggle svg { width: 12px; height: 12px; transition: transform 0.25s ease; }
    .desc-wrap.expanded .desc-toggle svg { transform: rotate(180deg); }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }
    .updated {
      font-size: 0.7rem;
      color: var(--text-mute);
      font-weight: 500;
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #021018;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.25);
    }
    .play-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(56, 189, 248, 0.4);
    }
    .play-btn svg { width: 13px; height: 13px; }

    /* ───────── EMPTY ───────── */
    .empty {
      padding: 60px 20px;
      text-align: center;
      border-radius: var(--radius-xl);
      border: 1px dashed var(--border-strong);
      background: var(--surface);
      color: var(--text-dim);
      margin-top: 10px;
    }
    .empty svg {
      width: 44px;
      height: 44px;
      margin-bottom: 14px;
      opacity: 0.5;
    }

    /* ───────── MOBILE NAV BUTTON ───────── */
    .mobile-menu-btn {
      display: none;
    }

    /* ───────── RESPONSIVE ───────── */
    @media (max-width: 1100px) {
      .scroll-row { grid-auto-columns: clamp(220px, 42vw, 280px); }
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(var(--sidebar-w), 84vw);
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 50;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop.open { display: block; }
      .mobile-menu-btn { display: grid; }
      .featured-inner { max-width: 100%; padding: 30px 28px; }
      .featured-overlay {
        background: linear-gradient(0deg, rgba(5,7,13,0.96), rgba(5,7,13,0.55) 60%, rgba(5,7,13,0.2) 100%);
      }
      [data-theme="light"] .featured-overlay {
        background: linear-gradient(0deg, rgba(255,255,255,0.97), rgba(255,255,255,0.75) 60%, rgba(255,255,255,0.4) 100%);
      }
      .top-bar { padding: 0 18px; gap: 12px; }
      .chip-select span.lbl { display: none; }
      .content { padding: 22px 18px 40px; }
      .scroll-row { grid-auto-columns: 75%; gap: 14px; }
    }

    @media (max-width: 560px) {
      .featured { min-height: 250px; }
      .featured-inner { min-height: 250px; padding: 24px 20px; }
      .featured-title { font-size: 1.35rem; }
      .featured-desc { font-size: 0.88rem; }
      .scroll-row { grid-auto-columns: 84%; }
      .top-filters .chip-select { padding: 0 12px; }
      .page-head { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

            "<rect x='80' y='60' width='"+(140+variant*20)+"' height='70' rx='10'/>" +

            "<rect x='240' y='230' width='22' height='30' rx='2'/>" +
            "<rect x='292' y='270' width='22' height='30' rx='2'/>" +
            "<rect x='405' y='270' width='18' height='26' rx='2'/>" +
            "<rect x='555' y='210' width='26' height='34' rx='2'/>" +
            "<rect x='617' y='240' width='26' height='34' rx='2'/>" +

            "<circle cx='380' cy='"+(290-off)+"' r='4'/>" +
            "<circle cx='560' cy='"+(180+variant*6)+"' r='4'/>" +
            "<circle cx='680' cy='"+(340-off/2)+"' r='4'/>" +
          "</g>";
      }

      const svg =
        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500' preserveAspectRatio='xMidYMid slice'>" +
          "<defs>" +
            "<linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
              "<stop offset='0%25' stop-color='"+p.g0+"'/>" +
              "<stop offset='55%25' stop-color='"+p.g1+"'/>" +
              "<stop offset='100%25' stop-color='"+p.g2+"'/>" +
            "</linearGradient>" +
            "<pattern id='dots' width='30' height='30' patternUnits='userSpaceOnUse'>" +
              "<circle cx='1.5' cy='1.5' r='1.2' fill='white' opacity='0.08'/>" +
            "</pattern>" +
          "</defs>" +
          "<rect width='800' height='500' fill='url(%23g)'/>" +
          "<rect width='800' height='500' fill='url(%23dots)'/>" +
          shapes +
        "</svg>";

      return "url('data:image/svg+xml;utf8," + svg + "')";
    };

    // ============================================================
    // THEME
    // ============================================================
    const applyTheme = (mode) => {
      document.documentElement.setAttribute("data-theme", mode);
      const icon = $("#themeIcon");
      if (!icon) return;
      icon.innerHTML = mode === "dark"
        ? `<circle cx="12" cy="12" r="4.5"></circle><line x1="12" y1="1.5" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22.5"></line><line x1="4.22" y1="4.22" x2="5.99" y2="5.99"></line><line x1="18.01" y1="18.01" x2="19.78" y2="19.78"></line><line x1="1.5" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22.5" y2="12"></line><line x1="4.22" y1="19.78" x2="5.99" y2="18.01"></line><line x1="18.01" y1="5.99" x2="19.78" y2="4.22"></line>`
        : mode === "light"
          ? `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`
          : `<path d="M4 12a8 8 0 0 1 8-8"></path><path d="M20 12a8 8 0 0 1-8 8"></path><circle cx="12" cy="12" r="2.5"></circle>`;
    };

    const initTheme = () => {
      const saved = storage.get(FAV_KEYS.theme, "dark");
      applyTheme(saved);
      $("#themeToggle")?.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") || "dark";
        const next = current === "dark" ? "light" : current === "light" ? "auto" : "dark";
        storage.set(FAV_KEYS.theme, next);
        applyTheme(next);
      });
    };

    // ============================================================
    // FILTERING / SORTING
    // ============================================================
    const getFilteredData = () => {
      const q = state.q.trim().toLowerCase();
      let topics = DATA.topics.map(t => ({ ...t, games: [...t.games] }));

      if (state.category !== "all") topics = topics.filter(t => t.id === state.category);

      if (q) {
        topics = topics
          .map(t => {
            const tText = [t.title, t.description, ...(t.tags || [])].join(" ").toLowerCase();
            const tMatch = tText.includes(q);
            const games = t.games.filter(g =>
              [g.title, g.description, t.title].join(" ").toLowerCase().includes(q)
            );
            return { ...t, games, tMatch };
          })
          .filter(t => t.tMatch || t.games.length > 0);
      }

      if (state.sort === "alpha") topics.sort((a, b) => a.title.localeCompare(b.title));
      if (state.sort === "recent") topics.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

      topics.forEach(t => {
        if (state.sort === "alpha") t.games.sort((a, b) => a.title.localeCompare(b.title));
        if (state.sort === "recent") t.games.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      });

      return topics;
    };

    // ============================================================
    // SIDEBAR
    // ============================================================
    const buildSidebar = () => {
      const list = $("#catList");
      const allCount = DATA.topics.reduce((s, t) => s + t.games.length, 0);

      const items = [
        { id: "all", name: "All Games", count: allCount, gradient: "linear-gradient(135deg,var(--primary),#6366f1)" },
        ...DATA.topics.map(t => ({ id: t.id, name: t.title, count: t.games.length, gradient: t.gradient }))
      ];

      list.innerHTML = items.map(item => `
        <li role="none">
          <button class="cat-btn ${state.category === item.id ? "active" : ""}" data-cat="${item.id}" role="menuitem">
            <div class="cat-icon" style="background:${item.gradient}; color:#fff;">
              ${categoryIcon(item.id)}
            </div>
            <div class="cat-info">
              <div class="cat-name">${item.name}</div>
              <div class="cat-count">${item.count} game${item.count !== 1 ? "s" : ""}</div>
            </div>
          </button>
        </li>
      `).join("");

      $$("#catList .cat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.category = btn.dataset.cat;
          $$("#catList .cat-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          updatePageTitle();
          render();
          closeSidebar();
        });
      });

      $("#statTopics").textContent = DATA.topics.length;
      $("#statGames").textContent = allCount;
    };

    const updatePageTitle = () => {
      if (state.category === "all") {
        $("#pageTitle").textContent = "All Games";
        $("#pageSub").textContent = "Pick a category or scroll to explore. Hover cards for quick play.";
      } else {
        const t = DATA.topics.find(x => x.id === state.category);
        if (t) {
          $("#pageTitle").textContent = t.title;
          $("#pageSub").textContent = t.description;
        }
      }
    };

    // ============================================================
    // CATEGORY ROWS & GAME CARDS
    // ============================================================
    const gameCardHTML = (game, topic) => {
      const cover = getCoverArt(topic.id, game.id, game.cover);
      const newBadge = isNew(game.updatedAt) ? `<span class="new-badge">New</span>` : "";

      return (
        `<article class="game-card" data-game="${game.id}">` +
          `<a class="card-click-overlay" href="${game.href}" aria-label="Play ${game.title}"></a>` +
          `<div class="cover">` +
            `<div class="cover-img" style="background-image:${cover};"></div>` +
            `<div class="cover-overlay"></div>` +
            `<div class="cover-badges">` +
              newBadge +
              `<a href="${game.href}" class="quick-play" aria-label="Quick play ${game.title}" title="Quick play">${ICONS.play}</a>` +
            `</div>` +
            `<div class="cover-title"><h4>${game.title}</h4></div>` +
          `</div>` +
          `<div class="card-body">` +
            `<div class="desc-wrap" data-desc-wrap>` +
              `<p class="desc-text">${game.description}</p>` +
              `<button class="desc-toggle" data-desc-btn type="button">More info ${ICONS.chevron}</button>` +
            `</div>` +
            `<div class="card-footer" style="justify-content:flex-end;">` +
              `<a class="play-btn" href="${game.href}">Play ${ICONS.play}</a>` +
            `</div>` +
          `</div>` +
        `</article>`
      );
    };

    const categorySectionHTML = (topic) => {
      const iconBG = topic.gradient || `linear-gradient(135deg, ${topic.color}, var(--accent))`;
      return (
        `<section class="category-section" data-topic="${topic.id}">` +
          `<div class="cat-header">` +
            `<div class="cat-header-left">` +
              `<div class="cat-header-icon" style="background:${iconBG}; color:#fff;">${categoryIcon(topic.id)}</div>` +
              `<div class="cat-header-text"><h3>${topic.title}</h3><p>${topic.description}</p></div>` +
            `</div>` +
            `<div class="cat-header-right">` +
              `<span class="results-meta" style="padding:6px 12px; font-size:0.76rem;">${topic.games.length}</span>` +
            `</div>` +
          `</div>` +
          `<div class="row-wrap"><div class="scroll-row" role="list">` +
            topic.games.map(g => gameCardHTML(g, topic)).join("") +
          `</div></div>` +
        `</section>`
      );
    };

    const bindDescToggles = () => {
      $$("[data-desc-wrap]").forEach(wrap => {
        const text = wrap.querySelector(".desc-text");
        const btn = wrap.querySelector("[data-desc-btn]");
        if (!btn || !text) return;
        const needsToggle = text.scrollHeight > text.clientHeight + 2;
        btn.style.display = needsToggle ? "" : "none";
        btn.addEventListener("click", () => {
          const expanded = wrap.classList.toggle("expanded");
          btn.innerHTML = expanded ? `Less info ${ICONS.chevron}` : `More info ${ICONS.chevron}`;
        });
      });
    };

    // ============================================================
    // MAIN RENDER
    // ============================================================
    const render = () => {
      const topics = getFilteredData();
      const totalGames = topics.reduce((s, t) => s + t.games.length, 0);

      $("#resultsMeta").textContent = topics.length
        ? `${topics.length} categor${topics.length !== 1 ? "ies" : "y"} · ${totalGames} game${totalGames !== 1 ? "s" : ""}`
        : "Nothing found";

      $("#emptyState").hidden = topics.length > 0 && totalGames > 0;

      $("#categoriesWrap").innerHTML = topics.map(categorySectionHTML).join("");
      bindDescToggles();
    };

    // ============================================================
    // MOBILE SIDEBAR
    // ============================================================
    const openSidebar = () => { $("#sidebar")?.classList.add("open"); $("#sidebarBackdrop")?.classList.add("open"); };
    const closeSidebar = () => { $("#sidebar")?.classList.remove("open"); $("#sidebarBackdrop")?.classList.remove("open"); };

    // ============================================================
    // CONTROLS
    // ============================================================
    const initControls = () => {
      $("#search")?.addEventListener("input", e => { state.q = e.target.value; render(); });
      $("#sort")?.addEventListener("change", e => { state.sort = e.target.value; render(); });
      $("#mobileMenuBtn")?.addEventListener("click", openSidebar);
      $("#sidebarBackdrop")?.addEventListener("click", closeSidebar);
    };

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener("DOMContentLoaded", () => {
      $("#year").textContent = new Date().getFullYear();
      initTheme();
      buildSidebar();
      initControls();
      render();
    });
  </script>
</body>
</html>
